<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Woody — Atlas × Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Kalam:wght@400;700&family=Inter:wght@400;500&family=Lora:ital@0;1&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --paper: #efece3;
    --paper-dim: #e6e2d6;
    --ink: #201d1a;
    --ink-soft: #4a4844;
    --ink-faint: #8a8680;
    --ink-ghost: #b6b1a5;
    --accent: #7c6bce;
    --amber: #c4874a;
    --moss: #4e6b45;
    --rose: #8c5c5c;
  }
  [data-mode="dark"] {
    --paper: #0f0f0d;
    --paper-dim: #171713;
    --ink: #e8e4dc;
    --ink-soft: #8a8680;
    --ink-faint: #4a4844;
    --ink-ghost: #2a2520;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; }
  body {
    background-image:
      radial-gradient(circle at 15% 20%, rgba(32,29,26,0.05) 0, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(32,29,26,0.04) 0, transparent 55%);
    min-height: 100vh;
  }
  [data-mode="dark"] body {
    background-image:
      radial-gradient(circle at 15% 20%, rgba(124,107,206,0.07) 0, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(196,135,74,0.05) 0, transparent 55%);
  }
  .hand  { font-family: 'Kalam', cursive; font-weight: 400; }
  .hand-b{ font-family: 'Kalam', cursive; font-weight: 700; }
  .serif { font-family: 'Lora', serif; font-style: italic; }
  .mono  { font-family: 'Inter', sans-serif; letter-spacing: .12em; text-transform: uppercase; font-size: 10px; color: var(--ink-faint); }

  .pagehead { padding: 56px 64px 24px; border-bottom: 1px dashed var(--ink-ghost); }
  .pagehead .eyebrow { font-family:'Kalam',cursive; font-size:13px; color:var(--ink-faint); }
  .pagehead h1 { font-family:'Lora',serif; font-style:italic; font-weight:400; font-size:44px; margin:6px 0 8px; }
  .pagehead p  { font-family:'Kalam',cursive; max-width:660px; color:var(--ink-soft); font-size:16px; line-height:1.55; margin:0; }

  .section { padding: 56px 64px 24px; border-top: 1px dashed var(--ink-ghost); }
  .section-head { display:flex; align-items:baseline; gap:18px; margin-bottom:28px; flex-wrap:wrap; }
  .section-head .num {
    font-family:'Kalam',cursive; font-weight:700;
    border:1.5px solid var(--ink); border-radius:999px;
    width:40px; height:40px; display:grid; place-items:center; font-size:18px;
  }
  .section-head h2   { font-family:'Lora',serif; font-style:italic; font-weight:400; font-size:28px; margin:0; }
  .section-head .kicker { font-family:'Kalam',cursive; color:var(--ink-soft); font-size:15px; }

  .hypothesis-box {
    background: var(--paper-dim);
    border: 1.5px solid var(--ink);
    border-radius: 14px;
    padding: 28px 32px;
    margin-bottom: 40px;
    font-family: 'Kalam', cursive;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink-soft);
    max-width: 860px;
  }
  .hypothesis-box strong { color: var(--ink); font-weight: 700; }

  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:28px; }
  @media (max-width:1200px) { .grid3 { grid-template-columns:1fr 1fr; } }
  @media (max-width:820px)  { .grid3 { grid-template-columns:1fr; } }

  .frame {
    position:relative; background:var(--paper-dim); border:1.5px solid var(--ink);
    border-radius:14px; padding:20px 20px 22px; min-height:420px;
  }
  .frame .tape {
    position:absolute; top:-10px; left:24px;
    width:64px; height:18px;
    background:rgba(124,107,206,.28);
    border:1px dashed rgba(32,29,26,.3);
    transform:rotate(-2deg);
  }
  [data-mode="dark"] .frame .tape { background:rgba(124,107,206,.2); }
  .frame .label { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; gap:10px; }
  .frame .label .name { font-family:'Kalam',cursive; font-weight:700; font-size:18px; }
  .frame .label .idx  { font-family:'Kalam',cursive; font-size:12px; color:var(--ink-faint); letter-spacing:.08em; text-transform:uppercase; }
  .frame .oneliner { font-family:'Kalam',cursive; color:var(--ink-soft); font-size:13px; margin-top:8px; line-height:1.45; }
  .frame .notes { margin-top:14px; display:flex; flex-direction:column; gap:6px; }
  .frame .notes .n { font-family:'Kalam',cursive; color:var(--ink-soft); font-size:12.5px; line-height:1.45; padding-left:14px; position:relative; }
  .frame .notes .n::before { content:"—"; position:absolute; left:0; color:var(--ink-faint); }

  .mock {
    position:relative; width:100%; aspect-ratio:9/16; max-height:520px;
    margin:0 auto; border:1.5px solid var(--ink); border-radius:26px;
    background:var(--paper); overflow:hidden;
  }
  .mock.wide { aspect-ratio:4/3; max-height:300px; border-radius:14px; }

  .ink-line { stroke:var(--ink); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .ink-dash  { stroke-dasharray:3 4; }
  .ink-fill  { fill:var(--ink); }
  svg text { fill:var(--ink); }
  .t-hand   { font-family:'Kalam',cursive; font-weight:400; font-size:12px; }
  .t-hand-b { font-family:'Kalam',cursive; font-weight:700; font-size:13px; }
  .t-serif  { font-family:'Lora',serif; font-style:italic; font-size:14px; }
  .t-mono   { font-family:'Inter',sans-serif; font-size:9px; letter-spacing:.14em; text-transform:uppercase; fill:var(--ink-faint); }
  .t-faint  { fill:var(--ink-faint); }
  .t-soft   { fill:var(--ink-soft); }
  .call-arrow { stroke:var(--ink-faint); fill:none; stroke-width:1; stroke-linecap:round; stroke-dasharray:2 3; }
  .call-text  { font-family:'Caveat',cursive; font-size:13px; fill:var(--ink-soft); }

  .tweaks {
    position:fixed; right:18px; bottom:18px; z-index:60;
    background:var(--paper-dim); border:1.5px solid var(--ink);
    border-radius:14px; padding:14px 14px 12px; width:240px;
    font-family:'Kalam',cursive;
  }
  .tweaks h3 { font-family:'Lora',serif; font-style:italic; font-weight:400; font-size:18px; margin:0 0 8px; }
  .tweaks .row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:8px 0; font-size:13px; color:var(--ink-soft); }
  .tweaks .swatch { display:flex; gap:6px; }
  .tweaks .sw { border:1.2px solid var(--ink); border-radius:999px; padding:3px 9px; font-family:'Kalam',cursive; font-size:11.5px; color:var(--ink); background:transparent; cursor:pointer; }
  .tweaks .sw.active { background:var(--ink); color:var(--paper); }
  .tweaks .slim { font-size:11px; color:var(--ink-faint); margin-top:6px; border-top:1px dashed var(--ink-ghost); padding-top:8px; }

  .footer { padding:40px 64px 60px; border-top:1px dashed var(--ink-ghost); color:var(--ink-faint); font-family:'Kalam',cursive; font-size:13px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="density-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="density-blur-sm" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
</svg>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState } = React;
const VB = { w: 320, h: 568 };

/* ─── PRIMITIVES ─── */

function Phone({ children }) {
  return (
    <svg viewBox={`0 0 ${VB.w} ${VB.h}`} xmlns="http://www.w3.org/2000/svg"
      style={{ width:"100%", height:"100%", display:"block" }}>
      <text x={16} y={18} className="t-mono">09:41</text>
      <text x={VB.w-16} y={18} textAnchor="end" className="t-mono">woody</text>
      <line x1={12} y1={26} x2={VB.w-12} y2={26} className="ink-line ink-dash" strokeWidth="0.6" opacity=".5"/>
      {children}
    </svg>
  );
}

function Capsule({ x, y, w, h, dashed, fill, strokeOpacity = 1 }) {
  return (
    <rect x={x} y={y} width={w} height={h} rx={h/2} ry={h/2}
      fill={fill || "none"} stroke="var(--ink)" strokeWidth="1"
      strokeDasharray={dashed ? "3 3" : "0"} opacity={strokeOpacity}/>
  );
}

function Callout({ x1, y1, x2, y2, text, anchor="start" }) {
  return (
    <g>
      <path d={`M ${x1},${y1} Q ${(x1+x2)/2+6},${(y1+y2)/2-8} ${x2},${y2}`} className="call-arrow"/>
      <circle cx={x1} cy={y1} r={1.6} fill="var(--ink-faint)"/>
      <text x={x2} y={y2} className="call-text" textAnchor={anchor}>{text}</text>
    </g>
  );
}

function Node({ x, y, r=4, tone="violet", state="default", active }) {
  const color = { violet:"var(--accent)", amber:"var(--amber)", moss:"var(--moss)", rose:"var(--rose)" }[tone] || "var(--accent)";
  const filled = state==="known" || state==="playing" || active;
  return (
    <g>
      <circle cx={x} cy={y} r={r+4} fill={color} opacity={state==="unknown"?.06:.12}/>
      <circle cx={x} cy={y} r={r}
        fill={filled ? color : "none"} stroke="var(--ink)" strokeWidth="0.9"
        opacity={state==="unknown"?.4:1}/>
      {(state==="playing"||active) && (
        <ellipse cx={x} cy={y} rx={r+7} ry={(r+7)*.55}
          fill="none" stroke={color} strokeWidth="0.7" opacity=".7" strokeDasharray="2 3"/>
      )}
    </g>
  );
}

/* ─── DENSE GLOBE — globe with acoustic density terrain ─── */
function DenseGlobe({ cx, cy, r, nodes=[], active=null, density=[] }) {
  const rings = [r, r*.78, r*.55, r*.32];
  return (
    <g>
      {/* density terrain — blurred acoustic regions */}
      {density.map((d, i) => (
        <ellipse key={i}
          cx={cx + d.dx} cy={cy + d.dy}
          rx={d.rx} ry={d.ry * .62}
          fill={d.color || "var(--accent)"}
          opacity={d.op || .1}
          filter="url(#density-blur)"/>
      ))}
      {/* globe rings */}
      <circle cx={cx} cy={cy} r={r*1.05} className="ink-line" strokeWidth="0.6" opacity=".35"/>
      {rings.map((rr, i) => (
        <ellipse key={i} cx={cx} cy={cy} rx={rr} ry={rr*.62}
          className="ink-line"
          strokeWidth={i===0?1.1:.6}
          strokeDasharray={i===0?"0":"2 3"}
          opacity={i===0?.9:.5}/>
      ))}
      {/* contour paths */}
      <path d={`M ${cx-r*.9},${cy-r*.2} Q ${cx-r*.3},${cy-r*.55} ${cx+r*.5},${cy-r*.35} T ${cx+r*.95},${cy-r*.1}`}
        className="ink-line" strokeWidth="0.5" opacity=".4"/>
      <path d={`M ${cx-r*.85},${cy+r*.25} Q ${cx-r*.1},${cy+r*.1} ${cx+r*.6},${cy+r*.35}`}
        className="ink-line" strokeWidth="0.5" opacity=".4"/>
      <path d={`M ${cx},${cy-r} C ${cx+r*.35},${cy-r*.5} ${cx+r*.35},${cy+r*.5} ${cx},${cy+r}`}
        className="ink-line" strokeWidth="0.5" opacity=".35"/>
      {/* nodes */}
      {nodes.map((n, i) => <Node key={i} {...n} active={active===i}/>)}
    </g>
  );
}

/* ─── DIAL — the cockpit instrument ─── */
function Dial({ cx, cy, r, beadAngle=-50, beadFrac=.62, playing=false, showDensity=false, mini=false }) {
  const rad = d => d * Math.PI / 180;
  const bx = cx + Math.cos(rad(beadAngle)) * r * beadFrac;
  const by = cy + Math.sin(rad(beadAngle)) * r * beadFrac;
  const accent = "var(--accent)";
  const beadR = mini ? 4 : 8;

  return (
    <g>
      {/* density arcs on dial */}
      {showDensity && <>
        <ellipse cx={cx - r*.38} cy={cy - r*.28}
          rx={r*.32} ry={r*.22}
          fill={accent} opacity=".13" filter="url(#density-blur-sm)"/>
        <ellipse cx={cx - r*.18} cy={cy - r*.52}
          rx={r*.22} ry={r*.16}
          fill="var(--amber)" opacity=".09" filter="url(#density-blur-sm)"/>
        <ellipse cx={cx + r*.08} cy={cy - r*.28}
          rx={r*.18} ry={r*.13}
          fill={accent} opacity=".07" filter="url(#density-blur-sm)"/>
      </>}

      {/* rings */}
      <circle cx={cx} cy={cy} r={r} className="ink-line" strokeWidth={mini?.6:1.1}/>
      {!mini && <>
        <circle cx={cx} cy={cy} r={r*.72} className="ink-line" strokeWidth="0.5" strokeDasharray="2 3" opacity=".5"/>
        <circle cx={cx} cy={cy} r={r*.44} className="ink-line" strokeWidth="0.4" strokeDasharray="1 3" opacity=".4"/>
      </>}

      {/* axis lines */}
      {!mini && [0,90,180,270].map((d, i) => {
        const rr = rad(d);
        return <line key={i}
          x1={cx + Math.cos(rr)*r*.15} y1={cy + Math.sin(rr)*r*.15}
          x2={cx + Math.cos(rr)*r}     y2={cy + Math.sin(rr)*r}
          className="ink-line" strokeWidth="0.4" strokeDasharray="1 4" opacity=".3"/>;
      })}

      {/* axis labels — only when not mini */}
      {!mini && <>
        <text x={cx} y={cy - r - 7} textAnchor="middle" className="t-mono">ENERGY</text>
        <text x={cx + r + 5} y={cy + 3} className="t-mono">TEXTURE</text>
        <text x={cx} y={cy + r + 13} textAnchor="middle" className="t-mono">MOOD</text>
        <text x={cx - r - 5} y={cy + 3} textAnchor="end" className="t-mono">TEMPO</text>
      </>}

      {/* line from center to bead */}
      <line x1={cx} y1={cy} x2={bx} y2={by}
        className="ink-line" strokeWidth={mini?.5:.8}/>

      {/* orbit ring if playing */}
      {playing && !mini && (
        <circle cx={bx} cy={by} r={14}
          className="ink-line" strokeWidth="0.6" strokeDasharray="1.5 2.5" opacity=".6"/>
      )}

      {/* bead */}
      <circle cx={bx} cy={by} r={beadR}
        fill={accent} opacity={playing?.85:.7}
        stroke="var(--ink)" strokeWidth={mini?.6:.9}/>

      {/* center dot */}
      <circle cx={cx} cy={cy} r={mini?1.5:2.5} fill="var(--ink)" opacity=".35"/>
    </g>
  );
}

/* ─── SHARED DENSITY DATA ─── */
const globeDensity = [
  { dx: -42, dy: -32, rx: 68, ry: 44, color: "var(--accent)", op: .13 },
  { dx:  36, dy: -18, rx: 48, ry: 30, color: "var(--accent)", op: .09 },
  { dx: -14, dy:  38, rx: 38, ry: 26, color: "var(--amber)",  op: .08 },
  { dx:  60, dy:  28, rx: 30, ry: 20, color: "var(--moss)",   op: .06 },
];

const globeNodes = [
  { x:118, y:228, r:4,   tone:"violet", state:"known"   },
  { x:154, y:244, r:5,   tone:"violet", state:"default"  },
  { x:198, y:236, r:3.5, tone:"rose",   state:"default"  },
  { x:222, y:292, r:4,   tone:"violet", state:"known"   },
  { x:134, y:312, r:3,   tone:"amber",  state:"unknown"  },
  { x:184, y:182, r:3,   tone:"violet", state:"unknown"  },
];

/* ════════════════════════════════════════════════
   VARIANT A — ZOOM CONTINUOUS
   The globe and dial are the same space at different scales.
   ════════════════════════════════════════════════ */

const ZoomAtlas = ({ annotations }) => (
  <Phone>
    {/* dense globe — atlas scale */}
    <DenseGlobe cx={160} cy={262} r={136} nodes={globeNodes} density={globeDensity}/>
    {/* halo (secondary surface access) */}
    <circle cx={290} cy={46} r={12} className="ink-line" strokeWidth="1"/>
    <path d="M 284 46 A 6 6 0 0 1 296 46" className="ink-line" strokeWidth="1"/>
    {/* bead indicator — tiny dial marker, bottom-right */}
    <g opacity=".7">
      <circle cx={280} cy={510} r={16} className="ink-line" strokeWidth="0.8"/>
      <line x1={280} y1={510} x2={271} y2={498} className="ink-line" strokeWidth="0.6"/>
      <circle cx={271} cy={498} r={3.5} fill="var(--accent)" opacity=".8" stroke="var(--ink)" strokeWidth="0.6"/>
    </g>
    {/* intent input */}
    <Capsule x={16} y={532} w={244} h={28}/>
    <text x={28} y={551} className="t-hand t-faint" style={{fontSize:10}}>describe a vibe…</text>
    {annotations && <>
      <Callout x1={240} y1={310} x2={306} y2={350} text="density terrain — warm = well-mapped acoustic region" anchor="end"/>
      <Callout x1={280} y1={510} x2={200} y2={480} text="bead indicator (tiny dial): your coordinate, always visible" anchor="end"/>
      <Callout x1={160} y1={200} x2={60} y2={140} text="atlas scale — orientation. opened with intent." />
    </>}
  </Phone>
);

const ZoomTransition = ({ annotations }) => (
  <Phone>
    {/* globe contracting (scale ~70%, opacity fading) */}
    <g opacity=".55" transform="translate(160,262) scale(0.68) translate(-160,-262)">
      <DenseGlobe cx={160} cy={262} r={136} nodes={globeNodes.slice(0,3)} density={globeDensity.slice(0,2)}/>
    </g>
    {/* dial emerging from center */}
    <g opacity=".75">
      <Dial cx={160} cy={280} r={80} beadAngle={-50} beadFrac={.62} showDensity/>
    </g>
    {/* connection line: globe bead → dial bead */}
    <line x1={160} y1={262} x2={111} y2={231}
      stroke="var(--accent)" strokeWidth="0.8" strokeDasharray="2 3" opacity=".5"/>
    <circle cx={160} cy={262} r={3} fill="var(--accent)" opacity=".4"/>
    {/* gesture hint */}
    <text x={160} y={488} textAnchor="middle" className="t-mono">pinching in…</text>
    {annotations && <>
      <Callout x1={111} y1={231} x2={30} y2={180} text="bead didn't move — world changed scale around it"/>
      <Callout x1={160} y1={344} x2={276} y2={400} text="dial density = same taught regions, same coordinate" anchor="end"/>
      <Callout x1={160} y1={488} x2={260} y2={456} text="500ms, settle easing — not a navigation, a zoom" anchor="end"/>
    </>}
  </Phone>
);

const ZoomCockpit = ({ annotations }) => (
  <Phone>
    {/* full-size dial — cockpit scale */}
    <Dial cx={160} cy={270} r={130} beadAngle={-50} beadFrac={.62} showDensity playing/>
    {/* globe thumbnail — 4% opacity, you're still on the map */}
    <g opacity=".22">
      <ellipse cx={44} cy={520} rx={26} ry={16} className="ink-line" strokeWidth="0.7"/>
      <circle cx={38} cy={514} r={2.5} fill="var(--accent)" opacity=".8"/>
    </g>
    <text x={72} y={524} className="t-hand t-faint" style={{fontSize:10}}>atlas</text>
    {/* track info */}
    <text x={160} y={472} textAnchor="middle" className="t-hand-b" style={{fontSize:12}}>calamus — harold budd</text>
    <text x={160} y={488} textAnchor="middle" className="t-hand t-faint" style={{fontSize:10}}>drag bead to shift · whisper a word</text>
    {/* intent */}
    <Capsule x={16} y={528} w={288} h={32} dashed/>
    <text x={30} y={549} className="t-hand t-faint" style={{fontSize:10}}>shift the vibe…</text>
    {annotations && <>
      <Callout x1={111} y1={231} x2={30} y2={150} text="same bead position as atlas — coordinate preserved"/>
      <Callout x1={44} y1={520} x2={30} y2={480} text="globe thumbnail — you're still on the map; tap to zoom out"/>
      <Callout x1={240} y1={310} x2={306} y2={370} text="density arcs = taught regions rendered on dial surface" anchor="end"/>
    </>}
  </Phone>
);

/* ════════════════════════════════════════════════
   VARIANT B — PERSISTENT BAR
   Dial lives at the bottom. Globe above it.
   They share the same screen, not the same scale.
   ════════════════════════════════════════════════ */

const BarHome = ({ annotations }) => (
  <Phone>
    {/* globe fills the upper screen */}
    <DenseGlobe cx={160} cy={236} r={120} nodes={globeNodes} density={globeDensity}/>
    {/* halo */}
    <circle cx={290} cy={46} r={12} className="ink-line" strokeWidth="1"/>
    <path d="M 284 46 A 6 6 0 0 1 296 46" className="ink-line" strokeWidth="1"/>
    {/* intent input */}
    <Capsule x={16} y={424} w={288} h={40}/>
    <text x={30} y={449} className="t-hand t-faint">describe a vibe…</text>
    {/* dial bar — always present at bottom */}
    <line x1={0} y1={476} x2={320} y2={476} className="ink-line" strokeWidth="0.6" opacity=".4"/>
    <rect x={0} y={476} width={320} height={56} fill="var(--paper-dim)" opacity=".94"/>

        {!tweakOpen && (
          <button onClick={()=>setTweakOpen(true)}
            style={{fontFamily:"'Kalam',cursive", fontSize:13, background:"var(--paper-dim)",
              border:"1.5px solid var(--ink)", borderRadius:999, padding:"6px 14px", cursor:"pointer", color:"var(--ink)"}}>
            tweaks ↑
          </button>
        )}
        {tweakOpen && (
          <div className="tweaks">
            <h3>Tweaks</h3>
            <div className="row">
              <span>background</span>
              <div className="swatch">
                {["paper","dark"].map(v => (
                  <button key={v} className={"sw " + ((!dark&&v==="paper")||(dark&&v==="dark")?"active":"")}
                    onClick={()=>setDark(v==="dark")}>{v}</button>
                ))}
              </div>
            </div>
            <div className="row">
              <span>annotations</span>
              <div className="swatch">
                <button className={"sw " + (annots?"active":"")} onClick={()=>setAnnots(true)}>on</button>
                <button className={"sw " + (!annots?"active":"")} onClick={()=>setAnnots(false)}>off</button>
              </div>
            </div>
            <div className="slim">globe-as-atlas · dial-as-cockpit · density as shared language</div>
            <button onClick={()=>setTweakOpen(false)}
              style={{marginTop:8, fontFamily:"'Kalam',cursive", fontSize:12, background:"none",
                border:"none", cursor:"pointer", color:"var(--ink-faint)"}}>
              hide
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Woody — Wireframe Exploration</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Kalam:wght@400;700&family=Inter:wght@400;500&family=Lora:ital@0;1&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --paper: #efece3;
    --paper-dim: #e6e2d6;
    --ink: #201d1a;
    --ink-soft: #4a4844;
    --ink-faint: #8a8680;
    --ink-ghost: #b6b1a5;
    --accent: #7c6bce;
    --amber: #c4874a;
    --moss: #4e6b45;
    --rose: #8c5c5c;
    --rule: #201d1a;
  }
  [data-mode="dark"] {
    --paper: #15130f;
    --paper-dim: #1b1815;
    --ink: #e8e4dc;
    --ink-soft: #a8a39a;
    --ink-faint: #6e6a64;
    --ink-ghost: #44413c;
    --rule: #e8e4dc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; }
  body {
    background-image:
      radial-gradient(circle at 12% 18%, rgba(32,29,26,0.05) 0, transparent 50%),
      radial-gradient(circle at 82% 74%, rgba(32,29,26,0.04) 0, transparent 55%);
    min-height: 100vh;
  }
  [data-mode="dark"] body {
    background-image:
      radial-gradient(circle at 12% 18%, rgba(124,107,206,0.06) 0, transparent 50%),
      radial-gradient(circle at 82% 74%, rgba(196,135,74,0.04) 0, transparent 55%);
  }
  .hand { font-family: 'Kalam', 'Caveat', cursive; font-weight: 400; }
  .hand-b { font-family: 'Kalam', 'Caveat', cursive; font-weight: 700; }
  .caveat { font-family: 'Caveat', cursive; font-weight: 600; }
  .serif { font-family: 'Lora', serif; font-style: italic; }
  .mono { font-family: 'Inter', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; font-size: 10px; color: var(--ink-faint); }

  /* page chrome */
  .pagehead {
    padding: 56px 64px 24px;
    border-bottom: 1px dashed var(--ink-ghost);
  }
  .pagehead .eyebrow { font-family:'Kalam',cursive; font-size: 13px; color: var(--ink-faint); letter-spacing:.05em; }
  .pagehead h1 { font-family: 'Lora', serif; font-style: italic; font-weight: 400; font-size: 44px; margin: 6px 0 8px; }
  .pagehead p { font-family:'Kalam',cursive; max-width: 620px; color: var(--ink-soft); font-size: 16px; line-height: 1.55; margin: 0; }

  .section {
    padding: 56px 64px 24px;
    border-top: 1px dashed var(--ink-ghost);
  }
  .section:first-of-type { border-top: 0; }
  .section-head { display:flex; align-items:baseline; gap: 18px; margin-bottom: 28px; flex-wrap:wrap;}
  .section-head .num {
    font-family:'Kalam',cursive; font-weight:700;
    border: 1.5px solid var(--ink); border-radius: 999px;
    width: 40px; height: 40px; display:grid; place-items:center;
    font-size: 18px;
  }
  .section-head h2 { font-family: 'Lora', serif; font-style: italic; font-weight: 400; font-size: 28px; margin:0; }
  .section-head .kicker { font-family:'Kalam',cursive; color: var(--ink-soft); font-size: 15px; }

  .grid3 {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px;
  }
  @media (max-width: 1200px) { .grid3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 820px)  { .grid3 { grid-template-columns: 1fr; } }

  .frame {
    position: relative;
    background: var(--paper-dim);
    border: 1.5px solid var(--ink);
    border-radius: 14px;
    padding: 20px 20px 22px;
    min-height: 420px;
  }
  .frame .tape {
    position: absolute; top: -10px; left: 24px;
    width: 64px; height: 18px;
    background: rgba(196,135,74, 0.28);
    border: 1px dashed rgba(32,29,26,0.3);
    transform: rotate(-2deg);
  }
  [data-mode="dark"] .frame .tape { background: rgba(196,135,74, 0.22); }
  .frame .label {
    display:flex; align-items:baseline; justify-content: space-between; margin-bottom: 14px; gap: 10px;
  }
  .frame .label .name { font-family:'Kalam',cursive; font-weight:700; font-size: 18px; }
  .frame .label .idx { font-family:'Kalam',cursive; font-size: 12px; color: var(--ink-faint); letter-spacing:.08em; text-transform: uppercase; }
  .frame .oneliner { font-family:'Kalam',cursive; color: var(--ink-soft); font-size: 13px; margin-top: 8px; line-height: 1.45; }
  .frame .notes { margin-top: 14px; display:flex; flex-direction: column; gap: 6px; }
  .frame .notes .n { font-family:'Kalam',cursive; color: var(--ink-soft); font-size: 12.5px; line-height: 1.45; padding-left: 14px; position: relative; }
  .frame .notes .n::before { content:"—"; position:absolute; left: 0; color: var(--ink-faint); }

  /* phone-like mock */
  .mock {
    position: relative;
    width: 100%;
    aspect-ratio: 9 / 16;
    max-height: 520px;
    margin: 0 auto;
    border: 1.5px solid var(--ink);
    border-radius: 26px;
    background: var(--paper);
    overflow: hidden;
  }
  .mock.wide {
    aspect-ratio: 4/3; max-height: 340px; border-radius: 14px;
  }
  .mock .bez-top {
    height: 24px; border-bottom: 1px dashed var(--ink-ghost);
    display:flex; align-items:center; justify-content:space-between; padding: 0 14px;
    font-family:'Kalam',cursive; font-size: 10.5px; color: var(--ink-faint);
  }
  /* sketchy ink helpers */
  .ink-line { stroke: var(--ink); fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ink-dash { stroke-dasharray: 3 4; }
  .ink-fill { fill: var(--ink); }
  .ink-soft-fill { fill: var(--ink-soft); }
  .ghost { opacity: .55; }

  svg text { fill: var(--ink); }
  .t-hand { font-family: 'Kalam', cursive; font-weight: 400; font-size: 12px; }
  .t-hand-b { font-family: 'Kalam', cursive; font-weight: 700; font-size: 13px; }
  .t-serif { font-family: 'Lora', serif; font-style: italic; font-size: 14px; }
  .t-mono { font-family: 'Inter', sans-serif; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; fill: var(--ink-faint); }
  .t-faint { fill: var(--ink-faint); }
  .t-soft { fill: var(--ink-soft); }

  /* legend, arrows, margin callouts drawn on top of mocks */
  .call-arrow { stroke: var(--ink-faint); fill: none; stroke-width: 1; stroke-linecap: round; stroke-dasharray: 2 3; }
  .call-text { font-family:'Caveat', cursive; font-size: 13px; fill: var(--ink-soft); }

  /* variant toggler */
  .variant-nav {
    margin-top: 14px;
    display:flex; gap: 6px; align-items:center; justify-content:center;
    font-family:'Kalam', cursive; font-size: 12px; color: var(--ink-soft);
  }
  .variant-nav button {
    font-family: inherit; font-size: 12px;
    background: transparent; border: 1.2px solid var(--ink); color: var(--ink);
    padding: 4px 10px; border-radius: 999px; cursor: pointer;
  }
  .variant-nav button.active { background: var(--ink); color: var(--paper); }

  /* tweaks panel */
  .tweaks {
    position: fixed; right: 18px; bottom: 18px; z-index: 60;
    background: var(--paper-dim);
    border: 1.5px solid var(--ink);
    border-radius: 14px;
    padding: 14px 14px 12px;
    width: 268px;
    box-shadow: 4px 6px 0 rgba(32,29,26,0.08);
    font-family: 'Kalam', cursive;
  }
  .tweaks h3 { font-family:'Lora', serif; font-style: italic; font-weight: 400; font-size: 18px; margin: 0 0 8px; }
  .tweaks .row { display:flex; align-items:center; justify-content: space-between; gap: 10px; margin: 8px 0; font-size: 13px; color: var(--ink-soft); }
  .tweaks .swatch { display:flex; gap:6px; }
  .tweaks .sw { border: 1.2px solid var(--ink); border-radius: 999px; padding: 3px 9px; font-family:'Kalam',cursive; font-size: 11.5px; color: var(--ink); background: transparent; cursor:pointer; }
  .tweaks .sw.active { background: var(--ink); color: var(--paper); }
  .tweaks .slim { font-size: 11.5px; color: var(--ink-faint); margin-top: 6px; border-top: 1px dashed var(--ink-ghost); padding-top: 8px; }

  /* sketchy effects */
  [data-rough="high"] .frame { filter: url(#rough-high); }
  [data-rough="med"]  .frame { filter: url(#rough-med); }

  /* utility */
  .row-h { display:flex; gap: 10px; align-items:center; }
  .soft-rule { height: 1px; background: repeating-linear-gradient(90deg, var(--ink-ghost) 0 6px, transparent 6px 12px); margin: 14px 0; }

  .footer {
    padding: 40px 64px 60px; border-top: 1px dashed var(--ink-ghost);
    color: var(--ink-faint); font-family: 'Kalam', cursive; font-size: 13px;
  }

  /* color dots for annotations */
  .dot { display:inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: middle; margin-right: 6px; border: 1px solid var(--ink); }
</style>
</head>
<body>
<!-- SVG filters for sketchy roughness -->
<svg width="0" height="0" style="position:absolute">
  <filter id="rough-high">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
    <feDisplacementMap in="SourceGraphic" scale="1.2"/>
  </filter>
  <filter id="rough-med">
    <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="1" seed="5"/>
    <feDisplacementMap in="SourceGraphic" scale="0.6"/>
  </filter>
</svg>

<div id="root"></div>

<script type="application/json" id="tweak-defaults">/*EDITMODE-BEGIN*/{
  "mode": "paper",
  "rough": "none",
  "annotations": true
}/*EDITMODE-END*/</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const TWEAK_DEFAULTS = JSON.parse(
  document.getElementById('tweak-defaults').textContent
    .replace('/*EDITMODE-BEGIN*/','').replace('/*EDITMODE-END*/','')
);

/* ===========================================================
   SHARED SKETCH PRIMITIVES (SVG)
   All mocks are rendered inside an SVG with viewBox 0 0 320 568
   so they feel like phone screens.
=========================================================== */

const VB = { w: 320, h: 568 };

function Phone({ children, label, palette = "neutral" }) {
  return (
    <svg viewBox={`0 0 ${VB.w} ${VB.h}`} xmlns="http://www.w3.org/2000/svg" style={{ width: "100%", height: "100%", display:"block" }}>
      {/* status bar */}
      <g>
        <text x={16} y={18} className="t-mono">09:41</text>
        <text x={VB.w-16} y={18} textAnchor="end" className="t-mono">woody</text>
        <line x1={12} y1={26} x2={VB.w-12} y2={26} className="ink-line ink-dash" strokeWidth="0.6" opacity=".5"/>
      </g>
      {children}
    </svg>
  );
}

/** Sketchy globe: concentric + wobbled ellipse and some nodes */
function Globe({ cx, cy, r, nodes = [], active = null, density = "med", showLabels = false }) {
  const rings = [r, r*0.78, r*0.55, r*0.32];
  return (
    <g>
      {/* territory washes */}
      <circle cx={cx} cy={cy} r={r*1.05} className="ink-line" strokeWidth="0.6" opacity=".35"/>
      {rings.map((rr, i) => (
        <ellipse key={i} cx={cx} cy={cy} rx={rr} ry={rr*0.62} className="ink-line"
          strokeWidth={i===0? 1.1 : 0.6}
          strokeDasharray={i===0 ? "0" : "2 3"}
          opacity={i===0 ? 0.9 : 0.5} />
      ))}
      {/* contour squiggles */}
      <path d={`M ${cx-r*0.9},${cy-r*0.2} Q ${cx-r*0.3},${cy-r*0.55} ${cx+r*0.5},${cy-r*0.35} T ${cx+r*0.95},${cy-r*0.1}`} className="ink-line" strokeWidth="0.5" opacity=".4"/>
      <path d={`M ${cx-r*0.85},${cy+r*0.25} Q ${cx-r*0.1},${cy+r*0.1} ${cx+r*0.6},${cy+r*0.35}`} className="ink-line" strokeWidth="0.5" opacity=".4"/>
      {/* meridian */}
      <path d={`M ${cx},${cy-r} C ${cx+r*0.35},${cy-r*0.5} ${cx+r*0.35},${cy+r*0.5} ${cx},${cy+r}`} className="ink-line" strokeWidth="0.5" opacity=".35"/>
      {/* nodes */}
      {nodes.map((n, i) => (
        <Node key={i} {...n} active={active === i} />
      ))}
      {showLabels && nodes.filter(n => n.label).map((n, i) => (
        <text key={"l"+i} x={n.x + (n.labelDx || 10)} y={n.y + (n.labelDy || 3)} className="t-hand" fill="currentColor">{n.label}</text>
      ))}
    </g>
  );
}

function Node({ x, y, r = 4, tone = "violet", state = "default", active }) {
  const color = { violet: "var(--accent)", amber: "var(--amber)", moss: "var(--moss)", rose: "var(--rose)" }[tone] || "var(--accent)";
  const filled = state === "known" || state === "playing" || active;
  return (
    <g>
      {/* glow */}
      <circle cx={x} cy={y} r={r+4} fill={color} opacity={state === "unknown" ? 0.06 : 0.14} />
      {/* base */}
      <circle cx={x} cy={y} r={r}
        fill={filled ? color : "none"}
        stroke="var(--ink)" strokeWidth="0.9"
        opacity={state === "unknown" ? 0.4 : 1}/>
      {/* orbit for playing */}
      {(state === "playing" || active) && (
        <ellipse cx={x} cy={y} rx={r+7} ry={(r+7)*0.55} fill="none" stroke={color} strokeWidth="0.7" opacity=".7" strokeDasharray="2 3"/>
      )}
      {state === "saving" && (
        <circle cx={x} cy={y} r={r+8} fill="none" stroke="var(--amber)" strokeWidth="0.6" strokeDasharray="1 3"/>
      )}
    </g>
  );
}

function Capsule({ x, y, w, h, dashed, fill, strokeOpacity = 1 }) {
  return (
    <rect x={x} y={y} width={w} height={h} rx={h/2} ry={h/2}
      fill={fill || "none"} stroke="var(--ink)" strokeWidth="1"
      strokeDasharray={dashed ? "3 3" : "0"}
      opacity={strokeOpacity}/>
  );
}

function Callout({ x1, y1, x2, y2, text, anchor="start" }) {
  return (
    <g>
      <path d={`M ${x1},${y1} Q ${(x1+x2)/2 + 6},${(y1+y2)/2 - 8} ${x2},${y2}`} className="call-arrow"/>
      <circle cx={x1} cy={y1} r={1.6} fill="var(--ink-faint)"/>
      <text x={x2} y={y2} className="call-text" textAnchor={anchor}>{text}</text>
    </g>
  );
}

/* small helper to make a sprinkle of nodes */
function scatter(seed, n, cx, cy, r) {
  const out = [];
  let s = seed;
  const rand = () => { s = (s*9301 + 49297) % 233280; return s/233280; };
  for (let i=0;i<n;i++) {
    const a = rand() * Math.PI * 2;
    const rr = (0.2 + rand()*0.85) * r;
    out.push({ x: cx + Math.cos(a)*rr, y: cy + Math.sin(a)*rr*0.62, r: 2.4 + rand()*2.6,
      tone: ["violet","amber","moss","rose"][Math.floor(rand()*4)],
      state: rand() > 0.7 ? "known" : (rand() > 0.5 ? "default" : "unknown") });
  }
  return out;
}

/* ===========================================================
   FRAMES — each surface has 3 approaches as components.
   Every frame is a full phone-shaped mock.
=========================================================== */

/* ----- HOME IDLE (3 approaches) ----- */
const HomeIdleA = ({ annotations }) => (
  <Phone>
    <Globe cx={160} cy={260} r={130} nodes={[]} />
    {/* center serif prompt */}
    <text x={160} y={256} textAnchor="middle" className="t-serif t-soft">your territory is blank</text>
    <text x={160} y={276} textAnchor="middle" className="t-hand t-faint">describe a vibe to begin</text>
    {/* halo top right */}
    <circle cx={290} cy={46} r={12} className="ink-line" strokeWidth="1"/>
    <path d="M 284 46 A 6 6 0 0 1 296 46" className="ink-line" strokeWidth="1"/>
    {/* intent input bottom */}
    <Capsule x={16} y={506} w={288} h={44} />
    <text x={30} y={532} className="t-hand t-faint">describe a vibe — any vibe. we do the rest.</text>
    <circle cx={285} cy={528} r={5} className="ink-line" strokeWidth="0.9"/>
    {annotations && (<>
      <Callout x1={290} y1={58} x2={236} y2={92} text="halo — the only door" />
      <Callout x1={160} y1={296} x2={76} y2={360} text="empty state = invitation, serif Lora" />
      <Callout x1={160} y1={506} x2={260} y2={478} text="capsule input, full-width, 14–16px radius" anchor="end"/>
    </>)}
  </Phone>
);

const HomeIdleB = ({ annotations }) => (
  <Phone>
    {/* giant serif centered, no globe yet — it emerges on intent */}
    <g>
      <text x={160} y={230} textAnchor="middle" className="t-serif" style={{fontSize:22}}>tonight,</text>
      <text x={160} y={258} textAnchor="middle" className="t-serif" style={{fontSize:22}}>where do you want to go?</text>
    </g>
    {/* faint globe sketch behind as watermark */}
    <g opacity="0.22">
      <ellipse cx={160} cy={400} rx={130} ry={80} className="ink-line" strokeWidth="0.7"/>
      <ellipse cx={160} cy={400} rx={80} ry={50} className="ink-line" strokeWidth="0.5" strokeDasharray="2 3"/>
    </g>
    {/* halo */}
    <circle cx={290} cy={46} r={12} className="ink-line" strokeWidth="1"/>
    <path d="M 284 46 A 6 6 0 0 1 296 46" className="ink-line" strokeWidth="1"/>
    {/* Big input — this version leans on input-as-hero */}
    <Capsule x={16} y={470} w={288} h={80} />
    <text x={30} y={504} className="t-hand t-faint">a slow bass-heavy night drive…</text>
    <line x1={30} y1={516} x2={180} y2={516} className="ink-line" strokeWidth="0.6" opacity=".3"/>
    <text x={296} y={544} textAnchor="end" className="t-mono">return ↵</text>
    {annotations && (<>
      <Callout x1={160} y1={268} x2={80} y2={336} text="serif carries the ask — globe recedes" />
      <Callout x1={160} y1={470} x2={250} y2={430} text="input = multi-line, poetic, sized like a journal entry" anchor="end"/>
    </>)}
  </Phone>
);

const HomeIdleC = ({ annotations }) => (
  <Phone>
    {/* full-bleed map grid — a 'topographic sheet' waiting */}
    <g opacity=".4">
      {[...Array(7)].map((_,i)=>(<path key={i} d={`M 0 ${80+i*56} Q 160 ${60+i*56} 320 ${84+i*56}`} className="ink-line" strokeWidth="0.5" strokeDasharray="1 3"/>))}
    </g>
    {/* corner glyph */}
    <circle cx={290} cy={46} r={12} className="ink-line" strokeWidth="1"/>
    <path d="M 284 46 A 6 6 0 0 1 296 46" className="ink-line" strokeWidth="1"/>
    {/* inline prompt: a single pulsing marker waiting for a name */}
    <g>
      <Node x={160} y={256} r={6} tone="amber" state="playing" />
      <text x={160} y={294} textAnchor="middle" className="t-hand t-soft">drop a pin for tonight</text>
    </g>
    {/* input */}
    <Capsule x={16} y={506} w={288} h={44} />
    <text x={30} y={532} className="t-hand t-faint">describe a place to stand…</text>
    {annotations && (<>
      <Callout x1={160} y1={250} x2={72} y2={190} text="single pulsing node = ‘place me somewhere’" />
      <Callout x1={0} y1={200} x2={110} y2={110} text="topo sheet waits for first mark" />
    </>)}
  </Phone>
);

/* ----- HOME ACTIVE (globe has nodes) ----- */
const nodesActive = [
  { x: 100, y: 210, r: 4, tone: "violet", state: "known" },
  { x: 146, y: 252, r: 5, tone: "violet", state: "default" },
  { x: 196, y: 244, r: 3.5, tone: "rose", state: "default" },
  { x: 220, y: 300, r: 4, tone: "violet", state: "known" },
  { x: 130, y: 320, r: 3, tone: "amber", state: "unknown" },
  { x: 180, y: 190, r: 3, tone: "violet", state: "unknown" },
];

const HomeActiveA = ({ annotations }) => (
  <Phone>
    <Globe cx={160} cy={260} r={130} nodes={nodesActive} />
    {/* 4 suggestion labels drifting near nodes */}
    <text x={76} y={204} className="t-hand-b t-soft">slow drift</text>
    <text x={76} y={216} className="t-hand t-faint">bon iver</text>
    <text x={212} y={244} className="t-hand-b t-soft">low tape</text>
    <text x={212} y={256} className="t-hand t-faint">nils frahm</text>
    <text x={150} y={352} className="t-hand-b t-soft">grain</text>
    <text x={150} y={362} className="t-hand t-faint">tim hecker</text>
    {/* halo */}
    <circle cx={290} cy={46} r={12} className="ink-line" strokeWidth="1"/>
    <path d="M 284 46 A 6 6 0 0 1 296 46" className="ink-line" strokeWidth="1"/>
    {/* session atmosphere chip */}
    <Capsule x={16} y={52} w={110} h={22} />
    <circle cx={28} cy={63} r={3} fill="var(--accent)"/>
    <text x={38} y={67} className="t-hand" style={{fontSize:11}}>nocturnal, mellow</text>
    {/* input stays full width */}
    <Capsule x={16} y={506} w={288} h={44} />

/* ===========================================================
   TWEAKS PANEL
=========================================================== */
function Tweaks({ tweaks, setTweaks, onOpenState }) {
  const set = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    // persist
    window.parent.postMessage({type:'__edit_mode_set_keys', edits:{[k]: v}}, '*');
  };
  return (
    <div className="tweaks" style={{display: onOpenState ? 'block' : 'none'}}>
      <h3>Tweaks</h3>
      <div className="row">
        <span>background</span>
        <div className="swatch">
          {["paper","dark"].map(v=>(
            <button key={v} className={"sw " + (tweaks.mode===v?"active":"")} onClick={()=>set('mode',v)}>{v}</button>
          ))}
        </div>
      </div>
      <div className="row">
        <span>sketch roughness</span>
        <div className="swatch">
          {["none","med","high"].map(v=>(
            <button key={v} className={"sw " + (tweaks.rough===v?"active":"")} onClick={()=>set('rough',v)}>{v}</button>
          ))}
        </div>
      </div>
      <div className="row">
        <span>annotations</span>
        <div className="swatch">
          <button className={"sw " + (tweaks.annotations?"active":"")} onClick={()=>set('annotations', true)}>on</button>
          <button className={"sw " + (!tweaks.annotations?"active":"")} onClick={()=>set('annotations', false)}>off</button>
        </div>
      </div>
      <div className="slim">
        three approaches per surface; toggle Tweaks off to hide this panel
      </div>
    </div>
  );
}

            <span className="tape"/>
            <div className="label"><span className="name">portal</span><span className="idx">pick</span></div>
            <p className="oneliner">Portal = A (bottom sheet). Saved detail = B (enter the terrain).</p>
            <div className="notes">
              <div className="n">bottom sheet is the lowest-risk; preserves globe behind</div>
              <div className="n">‘enter the terrain’ honors the memory-palace thesis</div>
              <div className="n">C variants are great for a tablet / landscape spinoff</div>
            </div>
          </div>
          <div className="frame">
            <span className="tape"/>
            <div className="label"><span className="name">onboarding</span><span className="idx">pick</span></div>
            <p className="oneliner">Moment 1 = B (mark + trust). Moment 2 = A (pulsing node). Add C2 as the teach-once beat.</p>
            <div className="notes">
              <div className="n">only add the anchor-word variant if cold-start data proves we need it</div>
              <div className="n">teach-once tooltip is non-negotiable — it's the only explicit teach</div>
              <div className="n">under 60s from arrival → first vibe</div>
            </div>
          </div>
        </div>
      </section>

      <footer className="footer">
        woody · wireframe exploration · three approaches per surface · pencil-fi · toggle Tweaks to change background, roughness, annotations
      </footer>

      <Tweaks tweaks={tweaks} setTweaks={setTweaks} onOpenState={tweakOpen}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

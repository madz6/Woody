<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Woody — Product Brainstorming</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Caveat:wght@500;700&family=Inter:wght@400;500&family=Lora:ital@0;1&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --paper: #efece3;
    --paper-dim: #e6e2d6;
    --ink: #201d1a;
    --ink-soft: #4a4844;
    --ink-faint: #8a8680;
    --ink-ghost: #b6b1a5;
    --accent: #7c6bce;
    --amber: #c4874a;
    --moss: #4e6b45;
    --rose: #8c5c5c;
  }
  [data-mode="dark"] {
    --paper: #15130f;
    --paper-dim: #1b1815;
    --ink: #e8e4dc;
    --ink-soft: #a8a39a;
    --ink-faint: #6e6a64;
    --ink-ghost: #44413c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family:'Inter', sans-serif; }
  .pagehead { padding: 56px 64px 24px; border-bottom: 1px dashed var(--ink-ghost); }
  .pagehead .eyebrow { font-family:'Kalam',cursive; font-size: 13px; color: var(--ink-faint); letter-spacing:.05em; }
  .pagehead h1 { font-family: 'Lora', serif; font-style: italic; font-weight: 400; font-size: 44px; margin: 6px 0 8px; max-width: 900px; line-height: 1.12; }
  .pagehead p { font-family:'Kalam',cursive; max-width: 720px; color: var(--ink-soft); font-size: 16px; line-height: 1.55; margin: 0; }
  .pagehead .leading { display:flex; gap: 36px; flex-wrap: wrap; margin-top: 22px; font-family:'Kalam',cursive; font-size: 13px; color: var(--ink-soft); }
  .pagehead .leading b { color: var(--ink); font-weight: 700; }

  .section { padding: 48px 64px 20px; border-top: 1px dashed var(--ink-ghost); }
  .section-head { display:flex; align-items:baseline; gap: 18px; margin-bottom: 24px; flex-wrap:wrap;}
  .section-head .num { font-family:'Kalam',cursive; font-weight:700;
    border: 1.5px solid var(--ink); border-radius: 999px; width: 44px; height: 44px;
    display:grid; place-items:center; font-size: 18px; }
  .section-head h2 { font-family: 'Lora', serif; font-style: italic; font-weight: 400; font-size: 30px; margin:0; }
  .section-head .kicker { font-family:'Kalam',cursive; color: var(--ink-soft); font-size: 15px; }

  .thesis {
    padding: 14px 18px;
    border-left: 2px solid var(--ink);
    font-family:'Kalam',cursive;
    color: var(--ink-soft);
    font-size: 14.5px; line-height: 1.55;
    margin: 0 0 28px; max-width: 900px;
  }
  .thesis b { color: var(--ink); }

  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
  @media (max-width: 1200px) { .grid3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 820px)  { .grid3 { grid-template-columns: 1fr; } }

  .frame {
    position: relative; background: var(--paper-dim);
    border: 1.5px solid var(--ink); border-radius: 14px;
    padding: 20px 20px 22px; min-height: 420px;
  }
  .frame .tape { position:absolute; top:-10px; left:24px; width:64px; height:18px;
    background: rgba(196,135,74,.28); border:1px dashed rgba(32,29,26,.3); transform: rotate(-2deg); }
  [data-mode="dark"] .frame .tape { background: rgba(196,135,74,.22); }
  .frame .label { display:flex; align-items:baseline; justify-content: space-between; margin-bottom: 14px; gap: 10px;}
  .frame .label .name { font-family:'Kalam',cursive; font-weight:700; font-size: 17px; }
  .frame .label .idx { font-family:'Kalam',cursive; font-size: 11px; color: var(--ink-faint); letter-spacing:.08em; text-transform: uppercase; }
  .frame .oneliner { font-family:'Kalam',cursive; color: var(--ink-soft); font-size: 13px; margin-top: 10px; line-height: 1.45; }
  .frame .notes { margin-top: 10px; display:flex; flex-direction: column; gap: 6px; }
  .frame .notes .n { font-family:'Kalam',cursive; color: var(--ink-soft); font-size: 12.5px; line-height: 1.45; padding-left: 14px; position: relative; }
  .frame .notes .n::before { content:"—"; position:absolute; left: 0; color: var(--ink-faint); }

  .mock {
    position: relative; width:100%; aspect-ratio: 9/16; max-height: 520px;
    margin: 0 auto; border: 1.5px solid var(--ink); border-radius: 26px;
    background: var(--paper); overflow: hidden;
  }

  svg text { fill: var(--ink); }
  .t-hand { font-family: 'Kalam', cursive; font-weight: 400; font-size: 12px; }
  .t-hand-b { font-family: 'Kalam', cursive; font-weight: 700; font-size: 13px; }
  .t-serif { font-family: 'Lora', serif; font-style: italic; font-size: 14px; }
  .t-mono { font-family: 'Inter', sans-serif; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; fill: var(--ink-faint); }
  .t-faint { fill: var(--ink-faint); }
  .t-soft  { fill: var(--ink-soft); }
  .ink-line { stroke: var(--ink); fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ink-dash { stroke-dasharray: 3 4; }
  .ink-fill { fill: var(--ink); }

  .call-arrow { stroke: var(--ink-faint); fill:none; stroke-width: 1; stroke-linecap: round; stroke-dasharray: 2 3; }
  .call-text { font-family:'Caveat',cursive; font-size: 13px; fill: var(--ink-soft); }

  /* matrix */
  .matrix { width: 100%; border-collapse: collapse; font-family:'Kalam',cursive; font-size: 13px; color: var(--ink-soft); }
  .matrix th, .matrix td { border-bottom: 1px dashed var(--ink-ghost); padding: 10px 12px; text-align: left; vertical-align: top; }
  .matrix th { font-weight: 700; color: var(--ink); font-size: 12px; letter-spacing:.05em; text-transform: uppercase; }
  .matrix td.m-name { color: var(--ink); font-weight: 700; white-space: nowrap; }
  .pill {
    display:inline-block; border:1px solid var(--ink); border-radius: 999px;
    padding: 2px 8px; font-size: 11px; color: var(--ink); margin-right: 6px;
  }
  .pill.good  { background: rgba(78,107,69,.15); }
  .pill.meh   { background: rgba(196,135,74,.15); }
  .pill.risk  { background: rgba(140,92,92,.18); }

  .footer {
    padding: 40px 64px 60px; border-top: 1px dashed var(--ink-ghost);
    color: var(--ink-faint); font-family:'Kalam',cursive; font-size: 13px;
  }

  .tweaks {
    position: fixed; right: 18px; bottom: 18px; z-index: 60;
    background: var(--paper-dim); border: 1.5px solid var(--ink);
    border-radius: 14px; padding: 14px; width: 240px;
    box-shadow: 4px 6px 0 rgba(32,29,26,.08); font-family:'Kalam',cursive;
  }
  .tweaks h3 { font-family:'Lora', serif; font-style: italic; font-weight: 400; font-size: 18px; margin: 0 0 8px;}
  .tweaks .row { display:flex; align-items:center; justify-content:space-between; gap: 10px; margin: 8px 0; font-size: 13px; color: var(--ink-soft); }
  .sw { border: 1.2px solid var(--ink); border-radius: 999px; padding: 3px 9px; font-family:inherit; font-size: 11.5px; color: var(--ink); background: transparent; cursor: pointer; }
  .sw.active { background: var(--ink); color: var(--paper); }
  .tweaks .slim { font-size: 11.5px; color: var(--ink-faint); margin-top: 6px; border-top: 1px dashed var(--ink-ghost); padding-top: 8px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="application/json" id="tweak-defaults">/*EDITMODE-BEGIN*/{"mode":"paper","annotations":true}/*EDITMODE-END*/</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = JSON.parse(
  document.getElementById('tweak-defaults').textContent
    .replace('/*EDITMODE-BEGIN*/','').replace('/*EDITMODE-END*/','')
);

/* ============================================================
   SKETCH PRIMITIVES
============================================================ */
const VB = { w: 320, h: 568 };

function Phone({ children }) {
  return (
    <svg viewBox={`0 0 ${VB.w} ${VB.h}`} xmlns="http://www.w3.org/2000/svg" style={{width:'100%', height:'100%', display:'block'}}>
      <g>
        <text x={16} y={18} className="t-mono">09:41</text>
        <text x={VB.w-16} y={18} textAnchor="end" className="t-mono">woody</text>
        <line x1={12} y1={26} x2={VB.w-12} y2={26} className="ink-line ink-dash" strokeWidth="0.6" opacity=".5"/>
      </g>
      {children}
    </svg>
  );
}
function Capsule({ x, y, w, h, dashed, fill }) {
  return <rect x={x} y={y} width={w} height={h} rx={h/2} ry={h/2}
    fill={fill||"none"} stroke="var(--ink)" strokeWidth="1" strokeDasharray={dashed?"3 3":"0"}/>;
}
function Callout({ x1, y1, x2, y2, text, anchor="start" }) {
  return (
    <g>
      <path d={`M ${x1},${y1} Q ${(x1+x2)/2 + 6},${(y1+y2)/2 - 8} ${x2},${y2}`} className="call-arrow"/>
      <circle cx={x1} cy={y1} r={1.6} fill="var(--ink-faint)"/>
      <text x={x2} y={y2} className="call-text" textAnchor={anchor}>{text}</text>
    </g>
  );
}

/* ============================================================
   METAPHOR FRAMES
   Each metaphor contributes 3 sketches: home, intent/interaction, memory/teach.
============================================================ */

/* ---------- DIAL ---------- */
const DialObject_Home = ({annotations}) => (
  <Phone>
    {/* the dial: big ring + facets + weighted bead */}
    <g transform="translate(160,300)">
      <circle r={120} className="ink-line" strokeWidth="1.2"/>
      <circle r={90}  className="ink-line" strokeWidth="0.6" strokeDasharray="2 3" opacity=".7"/>
      <circle r={56}  className="ink-line" strokeWidth="0.6" strokeDasharray="1 3" opacity=".5"/>
      {/* 4 facet labels */}
      <text x={0} y={-130} textAnchor="middle" className="t-mono">ENERGY</text>
      <text x={132} y={4} className="t-mono">TEXTURE</text>
      <text x={0} y={140} textAnchor="middle" className="t-mono">MOOD</text>
      <text x={-132} y={4} textAnchor="end" className="t-mono">TEMPO</text>
      {/* the bead / handle */}
      <line x1={0} y1={0} x2={-42} y2={-58} className="ink-line" strokeWidth="0.8"/>
      <circle cx={-42} cy={-58} r={10} fill="var(--accent)" opacity=".6" stroke="var(--ink)" strokeWidth="1"/>
      <circle cx={-42} cy={-58} r={16} className="ink-line" strokeWidth="0.5" strokeDasharray="1 3" opacity=".5"/>
      {/* density ring (learning) */}
      <path d="M -100 -30 A 100 100 0 0 1 40 -95" className="ink-line" strokeWidth="3" opacity=".22"/>
    </g>
    {/* track name below */}
    <text x={160} y={480} textAnchor="middle" className="t-hand-b">calamus — harold budd</text>
    <text x={160} y={498} textAnchor="middle" className="t-hand t-faint" style={{fontSize:11}}>2:14 · drag to shift · whisper a word</text>
    {/* quiet controls bottom */}
    <circle cx={58} cy={540} r={10} className="ink-line"/>
    <path d="M 54 535 L 54 545 M 62 535 L 62 545" className="ink-line"/>
    <circle cx={262} cy={540} r={10} className="ink-line"/>
    <path d="M 256 535 L 266 540 L 256 545" className="ink-line"/>
    {annotations && (<>
      <Callout x1={118} y1={242} x2={30} y2={150} text="bead = current acoustic vector. drag to push the music." />
      <Callout x1={180} y1={228} x2={290} y2={180} text="shaded arc = regions you've taught. learning is visible as density." anchor="end"/>
      <Callout x1={160} y1={480} x2={260} y2={436} text="track info demoted. the object is the hero." anchor="end"/>
    </>)}
  </Phone>
);
const DialObject_Intent = ({annotations}) => (
  <Phone>
    <g transform="translate(160,280)">
      <circle r={110} className="ink-line" strokeWidth="1"/>
      {/* whisper ring */}
      <circle r={130} className="ink-line" strokeWidth="0.6" strokeDasharray="1 3" opacity=".6"/>
      {/* word ghosts */}
      <text x={-90} y={-78} className="t-serif t-soft">slower</text>
      <text x={60} y={-90} className="t-serif t-soft">dirtier</text>
      <text x={94} y={70} className="t-serif t-soft">warmer</text>
      <text x={-110} y={64} className="t-serif t-soft">more room</text>
      {/* bead moving */}
      <line x1={0} y1={0} x2={24} y2={-60} className="ink-line"/>
      <circle cx={24} cy={-60} r={8} fill="var(--accent)" opacity=".7" stroke="var(--ink)"/>
      {/* drag path */}
      <path d="M -42 -58 Q 0 -80 24 -60" className="ink-line" strokeWidth="0.8" strokeDasharray="2 3" opacity=".6"/>
    </g>
    <text x={160} y={500} textAnchor="middle" className="t-hand-b">"dirtier"</text>
    <text x={160} y={518} textAnchor="middle" className="t-hand t-faint" style={{fontSize:11}}>whispered · dial drifted 6% toward texture</text>
    {annotations && (<>
      <Callout x1={160} y1={150} x2={70} y2={92} text="words float around the dial. tap or say them to nudge." />
      <Callout x1={184} y1={220} x2={300} y2={270} text="visible drag path — the user can SEE the system reinterpret." anchor="end"/>
    </>)}
  </Phone>
);
const DialObject_Memory = ({annotations}) => (
  <Phone>
    <g transform="translate(160,300)">
      <circle r={120} className="ink-line" strokeWidth="1"/>
      {/* pinned dial positions — saved moments */}
      {[
        {x:-58,y:-62,n:"fog drive",c:"var(--accent)"},
        {x:72,y:-40,n:"sunday",c:"var(--amber)"},
        {x:34,y:70,n:"folding",c:"var(--moss)"},
        {x:-78,y:50,n:"atrium",c:"var(--rose)"},
      ].map((p,i)=>(
        <g key={i}>
          <circle cx={p.x} cy={p.y} r={7} fill={p.c} opacity=".7" stroke="var(--ink)"/>
          <text x={p.x} y={p.y+22} textAnchor="middle" className="t-serif" style={{fontSize:12}}>{p.n}</text>
        </g>
      ))}
      {/* current bead, faint, halfway between two pins */}
      <circle cx={0} cy={0} r={4} fill="none" stroke="var(--ink)" strokeDasharray="1 2"/>
    </g>
    <text x={160} y={490} textAnchor="middle" className="t-hand t-faint" style={{fontSize:12}}>tap a pin to pull the dial there</text>
    {annotations && (<>
      <Callout x1={100} y1={236} x2={20} y2={180} text="memory = saved coordinates on the SAME object" />
      <Callout x1={232} y1={258} x2={300} y2={320} text="no separate memory screen — palace IS the dial" anchor="end"/>
    </>)}
  </Phone>
);

/* ---------- DIAL AS FIELD ---------- */
const DialField_Home = ({annotations}) => (
  <Phone>
    {/* fullscreen ambient field — topography of taste */}
    <g>
      {[...Array(6)].map((_,i)=>(
        <path key={i} d={`M 0 ${80+i*70} Q 160 ${60+i*70 + (i%2===0?-20:20)} 320 ${84+i*70}`} className="ink-line" strokeWidth="0.5" strokeDasharray="2 3" opacity=".45"/>
      ))}
      {/* 'here' bead */}
      <circle cx={170} cy={290} r={10} fill="var(--accent)" opacity=".7" stroke="var(--ink)" strokeWidth="1"/>
      <text x={186} y={294} className="t-hand">you</text>
      {/* density blotch (learned area) */}
      <ellipse cx={170} cy={290} rx={110} ry={70} fill="var(--accent)" opacity=".08"/>
    </g>
    <text x={160} y={480} textAnchor="middle" className="t-hand-b">calamus — harold budd</text>
    <text x={160} y={498} textAnchor="middle" className="t-hand t-faint" style={{fontSize:11}}>touch anywhere to drift there</text>
    {annotations && (<>
      <Callout x1={170} y1={290} x2={60} y2={200} text="no dial body. field IS the dial. your finger is the handle." />
      <Callout x1={230} y1={340} x2={306} y2={400} text="contour lines = what you've taught; wide open = unexplored." anchor="end"/>
    </>)}
  </Phone>
);
const DialField_Intent = ({annotations}) => (
  <Phone>
    <g>
      {/* user touches, trail */}
      <path d="M 80 280 Q 140 220 200 260 Q 240 290 260 310" className="ink-line" strokeWidth="0.9" strokeDasharray="3 4"/>
      <circle cx={260} cy={310} r={12} fill="var(--amber)" opacity=".5" stroke="var(--ink)"/>
      <circle cx={80} cy={280} r={4} className="ink-fill"/>
      {/* word floats near touch */}
      <text x={200} y={220} className="t-serif t-soft" style={{fontSize:16}}>warmer</text>
    </g>
    <text x={160} y={496} textAnchor="middle" className="t-hand t-faint" style={{fontSize:11}}>swipe to drift · long-press to speak a word</text>
    {annotations && (<>
      <Callout x1={170} y1={244} x2={40} y2={150} text="gesture-first. text/voice float as optional handles." />
      <Callout x1={260} y1={310} x2={310} y2={260} text="the music catches up in 2–4s — NOT instant" anchor="end"/>
    </>)}
  </Phone>
);
const DialField_Memory = ({annotations}) => (
  <Phone>
    <g>
      {[...Array(6)].map((_,i)=>(
        <path key={i} d={`M 0 ${80+i*70} Q 160 ${60+i*70 + (i%2===0?-20:20)} 320 ${84+i*70}`} className="ink-line" strokeWidth="0.5" strokeDasharray="2 3" opacity=".35"/>
      ))}
      {[
        {x:90,y:200,n:"fog drive"},{x:220,y:160,n:"sunday"},
        {x:240,y:300,n:"folding"},{x:110,y:360,n:"atrium"},
      ].map((p,i)=>(
        <g key={i}>
          <circle cx={p.x} cy={p.y} r={5} fill="var(--accent)" opacity=".6" stroke="var(--ink)"/>
          <text x={p.x+9} y={p.y+3} className="t-serif" style={{fontSize:12}}>{p.n}</text>
        </g>
      ))}
    </g>
    <text x={160} y={500} textAnchor="middle" className="t-hand t-faint" style={{fontSize:11}}>places you've named · pinch to see all at once</text>
    {annotations && (<>
      <Callout x1={96} y1={216} x2={40} y2={260} text="pins on the field — the field IS the memory" />
    </>)}
  </Phone>
);

/* ---------- DIAL AS COMPANION (tiny dial, music-viz hero) ---------- */
const DialCompanion_Home = ({annotations}) => (
  <Phone>
    {/* big music visualization — waveform / breathing blob */}
    <g transform="translate(160,250)">
      <circle r={90} className="ink-line" strokeWidth="0.6" strokeDasharray="1 4" opacity=".4"/>
      <path d="M -90 0 Q -45 -30 0 0 T 90 0" className="ink-line" strokeWidth="1.2"/>
      <path d="M -90 0 Q -45 30 0 0 T 90 0" className="ink-line" strokeWidth="1.2" opacity=".6"/>
      <path d="M -60 0 Q -30 -18 0 0 T 60 0" className="ink-line" strokeWidth="0.6" opacity=".3"/>
    </g>
    <text x={160} y={380} textAnchor="middle" className="t-serif" style={{fontSize:20}}>calamus</text>
    <text x={160} y={402} textAnchor="middle" className="t-hand t-faint" style={{fontSize:11}}>harold budd · the pearl</text>
    {/* tiny dial bottom */}
    <g transform="translate(160,510)">
      <circle r={24} className="ink-line" strokeWidth="1"/>
      <line x1={0} y1={0} x2={-10} y2={-14} className="ink-line"/>
      <circle cx={-10} cy={-14} r={4} fill="var(--accent)" opacity=".7" stroke="var(--ink)"/>
    </g>
    <text x={116} y={515} textAnchor="end" className="t-hand t-faint" style={{fontSize:11}}>shift</text>
    <text x={204} y={515} className="t-hand t-faint" style={{fontSize:11}}>save</text>
    {annotations && (<>
      <Callout x1={160} y1={250} x2={50} y2={170} text="music-viz is the hero — Woody as presence, not instrument" />
      <Callout x1={160} y1={510} x2={280} y2={470} text="dial shrunk to a companion — always there, never loud" anchor="end"/>
    </>)}
  </Phone>
);
const DialCompanion_Intent = ({annotations}) => (
  <Phone>
    <g transform="translate(160,260)">
      <path d="M -100 0 Q -50 -36 0 0 T 100 0" className="ink-line" strokeWidth="1"/>
      <path d="M -100 0 Q -50 36 0 0 T 100 0" className="ink-line" strokeWidth="1" opacity=".6"/>
    </g>
    {/* pulled up: dial expanded into a palette */}
    <g transform="translate(160,440)">
      <circle r={60} className="ink-line" strokeWidth="1"/>
      <circle r={44} className="ink-line" strokeWidth="0.5" strokeDasharray="1 3" opacity=".5"/>
      <text x={0} y={-68} textAnchor="middle" className="t-hand t-faint" style={{fontSize:10}}>pull up to tune</text>
      <text x={0} y={-48} textAnchor="middle" className="t-mono">ENERGY</text>
      <text x={62} y={4} className="t-mono">TEXTURE</text>
      <text x={0} y={60} textAnchor="middle" className="t-mono">MOOD</text>
      <text x={-62} y={4} textAnchor="end" className="t-mono">TEMPO</text>
      <circle cx={-22} cy={-26} r={6} fill="var(--accent)" opacity=".7" stroke="var(--ink)"/>
    </g>
    {annotations && (<>
      <Callout x1={160} y1={380} x2={280} y2={340} text="companion blooms into a full dial when pulled" anchor="end"/>
      <Callout x1={160} y1={500} x2={30} y2={540} text="release: collapses back to small companion" />
    </>)}
  </Phone>
);
const DialCompanion_Memory = ({annotations}) => (
  <Phone>

/* ============================================================
   SECTION BUILDER
============================================================ */
function MetaphorSection({ num, title, thesis, tagline, pills, variants, annotations }) {
  return (
    <section className="section">
      <div className="section-head">
        <div className="num">{num}</div>
        <h2>{title}</h2>
        <span className="kicker">{tagline}</span>
      </div>
      <div className="thesis">
        <b>Thesis.</b> {thesis}
        <div style={{marginTop: 10}}>
          {pills.map((p,i)=><span key={i} className={`pill ${p.k||""}`}>{p.t}</span>)}
        </div>
      </div>
      <div className="grid3">
        {variants.map((v,i)=>(
          <div key={i} className="frame">
            <span className="tape"/>
            <div className="label">
              <span className="name">{v.name}</span>
              <span className="idx">{["home","intent","memory"][i]}</span>
            </div>
            <div className="mock"><v.Comp annotations={annotations}/></div>
            <p className="oneliner">{v.oneliner}</p>
            <div className="notes">{v.notes.map((n,j)=>(<div key={j} className="n">{n}</div>))}</div>
          </div>
        ))}
      </div>
    </section>
  );
}

/* ============================================================
   APP

function App() {

    document.documentElement.setAttribute('data-mode', tweaks.mode);
  }, [tweaks]);

  const set = (k,v) => {

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Woody Wireframes — Round 2 · Atlas + Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Caveat:wght@500;700&family=Inter:wght@400;500&family=Lora:ital@0;1&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --paper: #efece3;
    --paper-dim: #e6e2d6;
    --ink: #201d1a;
    --ink-soft: #4a4844;
    --ink-faint: #8a8680;
    --ink-ghost: #b6b1a5;
    --accent: #7c6bce;
    --amber: #c4874a;
    --moss: #4e6b45;
    --rose: #8c5c5c;
  }
  [data-mode="dark"] {
    --paper: #15130f;
    --paper-dim: #1b1815;
    --ink: #e8e4dc;
    --ink-soft: #a8a39a;
    --ink-faint: #6e6a64;
    --ink-ghost: #44413c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family:'Inter', sans-serif; }

  .pagehead { padding: 56px 64px 24px; border-bottom: 1px dashed var(--ink-ghost); }
  .pagehead .eyebrow { font-family:'Kalam',cursive; font-size: 13px; color: var(--ink-faint); letter-spacing:.05em; }
  .pagehead h1 { font-family: 'Lora', serif; font-style: italic; font-weight: 400; font-size: 42px; margin: 6px 0 8px; max-width: 920px; line-height: 1.14; }
  .pagehead p { font-family:'Kalam',cursive; max-width: 760px; color: var(--ink-soft); font-size: 16px; line-height: 1.55; margin: 0; }
  .pagehead .leading { display:flex; gap: 28px; flex-wrap: wrap; margin-top: 22px; font-family:'Kalam',cursive; font-size: 13px; color: var(--ink-soft); }
  .pagehead .leading b { color: var(--ink); font-weight: 700; }

  .section { padding: 48px 64px 20px; border-top: 1px dashed var(--ink-ghost); }
  .section-head { display:flex; align-items:baseline; gap: 16px; margin-bottom: 20px; flex-wrap:wrap;}
  .section-head .num { font-family:'Kalam',cursive; font-weight:700; border: 1.5px solid var(--ink); border-radius: 999px; width: 44px; height: 44px; display:grid; place-items:center; font-size: 18px; }
  .section-head h2 { font-family: 'Lora', serif; font-style: italic; font-weight: 400; font-size: 30px; margin:0; }
  .section-head .kicker { font-family:'Kalam',cursive; color: var(--ink-soft); font-size: 15px; }

  .thesis { padding: 14px 18px; border-left: 2px solid var(--ink); font-family:'Kalam',cursive; color: var(--ink-soft); font-size: 14.5px; line-height: 1.55; margin: 0 0 24px; max-width: 960px; }
  .thesis b { color: var(--ink); }

  .grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
  @media (max-width: 1400px) { .grid5 { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 900px)  { .grid5 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 620px)  { .grid5 { grid-template-columns: 1fr; } }

  .frame { position: relative; background: var(--paper-dim); border: 1.5px solid var(--ink); border-radius: 14px; padding: 18px 16px 20px; }
  .frame .tape { position:absolute; top:-10px; left:22px; width:56px; height:16px; background: rgba(196,135,74,.28); border:1px dashed rgba(32,29,26,.3); transform: rotate(-2deg); }
  [data-mode="dark"] .frame .tape { background: rgba(196,135,74,.22); }
  .frame .label { display:flex; align-items:baseline; justify-content: space-between; margin-bottom: 12px; gap: 10px; }
  .frame .label .name { font-family:'Kalam',cursive; font-weight:700; font-size: 15px; }
  .frame .label .idx { font-family:'Kalam',cursive; font-size: 10px; color: var(--ink-faint); letter-spacing:.08em; text-transform: uppercase; }
  .frame .oneliner { font-family:'Kalam',cursive; color: var(--ink-soft); font-size: 12.5px; margin-top: 10px; line-height: 1.45; }

  .mock { position: relative; width:100%; aspect-ratio: 9/16; border: 1.5px solid var(--ink); border-radius: 22px; background: var(--paper); overflow: hidden; }

  svg text { fill: var(--ink); }
  .t-hand { font-family: 'Kalam', cursive; font-weight: 400; font-size: 12px; }
  .t-hand-b { font-family: 'Kalam', cursive; font-weight: 700; font-size: 13px; }
  .t-serif { font-family: 'Lora', serif; font-style: italic; font-size: 14px; }
  .t-mono { font-family: 'Inter', sans-serif; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; fill: var(--ink-faint); }
  .t-faint { fill: var(--ink-faint); }
  .t-soft  { fill: var(--ink-soft); }
  .ink-line { stroke: var(--ink); fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ink-dash { stroke-dasharray: 3 4; }
  .ink-fill { fill: var(--ink); }

  .call-arrow { stroke: var(--ink-faint); fill:none; stroke-width: 1; stroke-linecap: round; stroke-dasharray: 2 3; }
  .call-text { font-family:'Caveat',cursive; font-size: 12px; fill: var(--ink-soft); }

  .diagram { background: var(--paper-dim); border: 1.5px solid var(--ink); border-radius: 14px; padding: 18px 18px 20px; margin-bottom: 26px; }
  .diagram h3 { font-family:'Lora',serif; font-style: italic; font-weight: 400; font-size: 22px; margin: 0 0 8px; }
  .diagram p { font-family:'Kalam',cursive; color: var(--ink-soft); font-size: 13.5px; line-height: 1.5; margin: 0 0 14px; }

  .matrix { width: 100%; border-collapse: collapse; font-family:'Kalam',cursive; font-size: 13px; color: var(--ink-soft); }
  .matrix th, .matrix td { border-bottom: 1px dashed var(--ink-ghost); padding: 10px 12px; text-align: left; vertical-align: top; }
  .matrix th { font-weight: 700; color: var(--ink); font-size: 12px; letter-spacing:.05em; text-transform: uppercase; }
  .matrix td.m-name { color: var(--ink); font-weight: 700; white-space: nowrap; }
  .pill { display:inline-block; border:1px solid var(--ink); border-radius: 999px; padding: 2px 8px; font-size: 11px; color: var(--ink); margin-right: 6px; }
  .pill.good  { background: rgba(78,107,69,.15); }
  .pill.meh   { background: rgba(196,135,74,.15); }
  .pill.risk  { background: rgba(140,92,92,.18); }

  .footer { padding: 40px 64px 60px; border-top: 1px dashed var(--ink-ghost); color: var(--ink-faint); font-family:'Kalam',cursive; font-size: 13px; }

  .tweaks { position: fixed; right: 18px; bottom: 18px; z-index: 60; background: var(--paper-dim); border: 1.5px solid var(--ink); border-radius: 14px; padding: 14px; width: 240px; box-shadow: 4px 6px 0 rgba(32,29,26,.08); font-family:'Kalam',cursive; }
  .tweaks h3 { font-family:'Lora', serif; font-style: italic; font-weight: 400; font-size: 18px; margin: 0 0 8px;}
  .tweaks .row { display:flex; align-items:center; justify-content:space-between; gap: 10px; margin: 8px 0; font-size: 13px; color: var(--ink-soft); }
  .sw { border: 1.2px solid var(--ink); border-radius: 999px; padding: 3px 9px; font-family:inherit; font-size: 11.5px; color: var(--ink); background: transparent; cursor: pointer; }
  .sw.active { background: var(--ink); color: var(--paper); }
  .tweaks .slim { font-size: 11.5px; color: var(--ink-faint); margin-top: 6px; border-top: 1px dashed var(--ink-ghost); padding-top: 8px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="application/json" id="tweak-defaults">/*EDITMODE-BEGIN*/{
  "mode": "dark",
  "annotations": false,
  "density": "c"
}/*EDITMODE-END*/</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = JSON.parse(
  document.getElementById('tweak-defaults').textContent
    .replace('/*EDITMODE-BEGIN*/','').replace('/*EDITMODE-END*/','')
);

const VB = { w: 320, h: 568 };
function Phone({ children, tag }) {
  return (
    <svg viewBox={`0 0 ${VB.w} ${VB.h}`} xmlns="http://www.w3.org/2000/svg" style={{width:'100%', height:'100%', display:'block'}}>
      <g>
        <text x={16} y={18} className="t-mono">09:41</text>
        <text x={VB.w-16} y={18} textAnchor="end" className="t-mono">{tag||"woody"}</text>
        <line x1={12} y1={26} x2={VB.w-12} y2={26} className="ink-line ink-dash" strokeWidth="0.6" opacity=".5"/>
      </g>
      {children}
    </svg>
  );
}
function Capsule({ x, y, w, h, dashed, fill }) {
  return <rect x={x} y={y} width={w} height={h} rx={h/2} ry={h/2} fill={fill||"none"} stroke="var(--ink)" strokeWidth="1" strokeDasharray={dashed?"3 3":"0"}/>;
}
function Callout({ x1, y1, x2, y2, text, anchor="start", show=true }) {
  if (!show) return null;
  return (
    <g>
      <path d={`M ${x1},${y1} Q ${(x1+x2)/2 + 6},${(y1+y2)/2 - 8} ${x2},${y2}`} className="call-arrow"/>
      <circle cx={x1} cy={y1} r={1.6} fill="var(--ink-faint)"/>
      <text x={x2} y={y2} className="call-text" textAnchor={anchor}>{text}</text>
    </g>
  );
}

/* Halo glyph — always top right */
function Halo({cx=296, cy=46}) {
  return (
    <g>
      <circle cx={cx} cy={cy} r={12} className="ink-line" strokeWidth="0.8"/>
      <path d={`M ${cx-6} ${cy-2} q 6 -8 12 0`} className="ink-line" strokeWidth="0.7"/>
    </g>
  );
}

/* reusable: globe sketch */
function GlobeSketch({cx, cy, r, density=false}) {
  return (
    <g>
      <circle cx={cx} cy={cy} r={r} className="ink-line" strokeWidth="1"/>
      {/* latitudes */}
      {[-.6,-.3,0,.3,.6].map((t,i)=>(
        <ellipse key={i} cx={cx} cy={cy+t*r*0.3} rx={r*Math.cos(Math.abs(t)*0.9)} ry={r*0.16} className="ink-line" strokeWidth="0.5" opacity=".35" strokeDasharray="2 3"/>
      ))}
      {/* longitudes */}
      {[0,.35,-.35].map((t,i)=>(
        <ellipse key={i} cx={cx} cy={cy} rx={r*0.18 + Math.abs(t)*r*0.8} ry={r} className="ink-line" strokeWidth="0.4" opacity=".3" strokeDasharray="1 3"/>
      ))}
      {/* nodes */}
      <circle cx={cx-r*0.35} cy={cy-r*0.35} r={3.5} fill="var(--accent)" opacity=".75" stroke="var(--ink)"/>
      <circle cx={cx+r*0.2}  cy={cy-r*0.1}  r={2.5} fill="var(--amber)" opacity=".7"  stroke="var(--ink)"/>
      <circle cx={cx+r*0.4}  cy={cy+r*0.3}  r={3}   fill="var(--moss)"  opacity=".65" stroke="var(--ink)"/>
      <circle cx={cx-r*0.25} cy={cy+r*0.45} r={2.5} fill="var(--rose)"  opacity=".6"  stroke="var(--ink)"/>
      <circle cx={cx-r*0.05} cy={cy-r*0.55} r={2}   fill="var(--ink)"   opacity=".5"/>
      {density && (<>
        <path d={`M ${cx-r*0.6} ${cy-r*0.2} A ${r*0.7} ${r*0.7} 0 0 1 ${cx+r*0.2} ${cy-r*0.55}`} className="ink-line" strokeWidth="3" opacity=".18"/>
        <path d={`M ${cx-r*0.4} ${cy+r*0.3} A ${r*0.5} ${r*0.5} 0 0 1 ${cx+r*0.45} ${cy+r*0.2}`} className="ink-line" strokeWidth="2" opacity=".12"/>
      </>)}
    </g>
  );
}

/* reusable: dial sketch */
function DialSketch({cx, cy, r, density=false, beadAngle=-2.1, beadR}) {
  const bR = beadR ?? r*0.88;
  const bx = cx + Math.cos(beadAngle)*bR;
  const by = cy + Math.sin(beadAngle)*bR;
  return (
    <g>
      <circle cx={cx} cy={cy} r={r} className="ink-line" strokeWidth="1"/>
      <circle cx={cx} cy={cy} r={r*0.74} className="ink-line" strokeWidth="0.5" strokeDasharray="1 3" opacity=".55"/>
      <circle cx={cx} cy={cy} r={r*0.46} className="ink-line" strokeWidth="0.4" strokeDasharray="1 3" opacity=".4"/>
      {/* 4 facet ticks */}
      {[0, Math.PI/2, Math.PI, 3*Math.PI/2].map((a,i)=>(
        <line key={i} x1={cx+Math.cos(a)*(r*0.92)} y1={cy+Math.sin(a)*(r*0.92)} x2={cx+Math.cos(a)*r} y2={cy+Math.sin(a)*r} className="ink-line" strokeWidth="1"/>
      ))}
      <line x1={cx} y1={cy} x2={bx} y2={by} className="ink-line" strokeWidth="0.8"/>
      <circle cx={bx} cy={by} r={r*0.12} fill="var(--accent)" opacity=".7" stroke="var(--ink)" strokeWidth="1"/>
      {density && (<>
        <path d={`M ${cx-r*0.85} ${cy-r*0.2} A ${r} ${r} 0 0 1 ${cx+r*0.25} ${cy-r*0.85}`} className="ink-line" strokeWidth="3.5" opacity=".22"/>
        <path d={`M ${cx-r*0.4} ${cy+r*0.55} A ${r*0.8} ${r*0.8} 0 0 1 ${cx+r*0.55} ${cy+r*0.4}`} className="ink-line" strokeWidth="2.5" opacity=".14"/>
      </>)}
    </g>
  );
}

/* ==========================================================
   VARIANT A — Zoom-continuous
   Globe and dial are the same object at different scales.
   You zoom INTO the globe and you find the dial.
========================================================== */

/* A.1 — Atlas scale: full globe, tiny bead lives at your acoustic coordinate */
const A_Atlas = ({a}) => (
  <Phone tag="atlas · 1:1">
    <Halo/>
    <text x={16} y={46} className="t-mono">YOUR TERRITORY</text>
    <GlobeSketch cx={160} cy={280} r={124}/>
    {/* little "you" bead */}
    <g>
      <circle cx={160 - 124*0.35} cy={280 - 124*0.35} r={6} fill="var(--accent)" opacity=".85" stroke="var(--ink)" strokeWidth="1"/>
      <circle cx={160 - 124*0.35} cy={280 - 124*0.35} r={10} className="ink-line" strokeWidth="0.5" strokeDasharray="1 3" opacity=".55"/>
      <text x={160 - 124*0.35 + 14} y={280 - 124*0.35 + 4} className="t-hand" style={{fontSize:11}}>you</text>
    </g>
    {/* zoom affordance */}
    <g transform="translate(280,490)">
      <circle r={16} className="ink-line" strokeWidth="0.8"/>
      <text x={0} y={4} textAnchor="middle" className="t-hand-b" style={{fontSize:11}}>+</text>
    </g>
    <text x={296} y={528} textAnchor="end" className="t-hand t-faint" style={{fontSize:11}}>zoom to tune</text>
    <Capsule x={16} y={506} w={240} h={40}/>
    <text x={30} y={532} className="t-hand t-faint" style={{fontSize:12}}>describe a vibe…</text>
    <Callout show={a} x1={160-44} y1={248} x2={26} y2={180} text="bead = you, on the globe. small, quiet." />
    <Callout show={a} x1={280} y1={490} x2={180} y2={456} text="pinch or tap + to zoom INTO your location" anchor="end"/>
  </Phone>
);

/* A.2 — Zoom transition: globe becoming dial */
const A_Zoom = ({a}) => (
  <Phone tag="zooming">
    <Halo/>
    <text x={16} y={46} className="t-mono">ZOOMING IN</text>
    {/* globe edge cropping outward */}
    <circle cx={160} cy={300} r={260} className="ink-line" strokeWidth="0.6" opacity=".5"/>
    <circle cx={160} cy={300} r={200} className="ink-line" strokeWidth="0.5" strokeDasharray="2 3" opacity=".5"/>
    {/* dial emerging */}
    <DialSketch cx={160} cy={300} r={110} />
    <text x={160} y={470} textAnchor="middle" className="t-hand t-faint" style={{fontSize:11}}>close up: energy · texture · mood · tempo</text>
    <Callout show={a} x1={64} y1={270} x2={20} y2={160} text="continuous scale. no screen change — just zoom." />
    <Callout show={a} x1={268} y1={320} x2={304} y2={400} text="globe circles become the dial's outer rings" anchor="end"/>
  </Phone>
);

/* A.3 — Dial scale: fully zoomed in */
const A_Dial = ({a}) => (
  <Phone tag="dial · 1:100">
    <Halo/>
    <text x={16} y={46} className="t-mono">CLOSE UP · ENERGY</text>
    <DialSketch cx={160} cy={280} r={120}/>
    <text x={160} y={410} textAnchor="middle" className="t-serif" style={{fontSize:16}}>you're tuning "fog drive"</text>
    <text x={160} y={432} textAnchor="middle" className="t-hand t-faint" style={{fontSize:11}}>drag the bead · say a word · or type</text>
    <Capsule x={16} y={506} w={240} h={40}/>
    <text x={30} y={532} className="t-hand t-faint" style={{fontSize:12}}>shift the vibe…</text>
    {/* zoom out affordance */}
    <g transform="translate(280,490)">
      <circle r={16} className="ink-line" strokeWidth="0.8"/>
      <text x={0} y={4} textAnchor="middle" className="t-hand-b" style={{fontSize:11}}>−</text>
    </g>
    <text x={296} y={528} textAnchor="end" className="t-hand t-faint" style={{fontSize:11}}>back to atlas</text>
    <Callout show={a} x1={160} y1={160} x2={300} y2={120} text="same coordinate system — you haven't moved" anchor="end"/>
  </Phone>
);

/* A.4 — Memory: pinned coordinates visible at atlas scale */
const A_Memory = ({a}) => (
  <Phone tag="atlas · memory">
    <Halo/>
    <text x={16} y={46} className="t-mono">SAVED MOMENTS</text>
    <GlobeSketch cx={160} cy={280} r={124}/>
    {/* named coordinates */}
    {[
      {dx:-0.35,dy:-0.35,n:"fog drive"},
      {dx:0.2,dy:-0.1,n:"sunday"},
      {dx:0.4,dy:0.3,n:"folding"},
      {dx:-0.25,dy:0.45,n:"atrium"},
    ].map((p,i)=>(
      <g key={i}>
        <circle cx={160 + 124*p.dx} cy={280 + 124*p.dy} r={5} fill="var(--accent)" opacity=".7" stroke="var(--ink)"/>
        <text x={160 + 124*p.dx + 8} y={280 + 124*p.dy + 3} className="t-serif" style={{fontSize:12}}>{p.n}</text>
      </g>
    ))}
    <text x={160} y={470} textAnchor="middle" className="t-hand t-faint" style={{fontSize:11}}>tap a name · it pulls you there + zooms to dial</text>
    <Callout show={a} x1={125} y1={236} x2={30} y2={180} text="memory lives on the atlas — no list surface" />
  </Phone>
);

/* A.5 — Playing: while tuned, dial collapses to ring-bead, mini-player sits atop */
const A_Playing = ({a}) => (
  <Phone tag="playing">
    <Halo/>
    <GlobeSketch cx={160} cy={260} r={110}/>
    {/* mini-player capsule atop */}
    <Capsule x={16} y={440} w={288} h={56}/>
    <rect x={28} y={452} width={32} height={32} rx={6} className="ink-line" strokeWidth="0.8"/>
    <text x={70} y={464} className="t-hand-b">calamus</text>
    <text x={70} y={478} className="t-hand t-faint" style={{fontSize:11}}>harold budd</text>
    {/* shift-vibe pill right */}
    <Capsule x={218} y={454} w={74} h={30}/>
    <text x={255} y={473} textAnchor="middle" className="t-hand" style={{fontSize:11}}>shift vibe</text>
    <text x={160} y={532} textAnchor="middle" className="t-hand t-faint" style={{fontSize:11}}>tap shift vibe · zoom lands on the dial</text>
    <Callout show={a} x1={255} y1={454} x2={300} y2={406} text="shift-vibe IS the zoom trigger" anchor="end"/>
  </Phone>
);

/* ==========================================================
   VARIANT B — Persistent dial bar
   Dial always at the bottom as a small companion; globe is the canvas
========================================================== */

const B_Home = ({a}) => (
  <Phone tag="home">
    <Halo/>
    <text x={16} y={46} className="t-mono">YOUR TERRITORY</text>
    <GlobeSketch cx={160} cy={250} r={110}/>
    {/* dial bar: sits above intent input */}
    <g transform="translate(16,420)">
      <rect x={0} y={0} width={288} height={56} rx={28} className="ink-line" strokeWidth="1"/>
      <DialSketch cx={30} cy={28} r={18}/>
      <text x={62} y={26} className="t-hand-b">the dial</text>
      <text x={62} y={42} className="t-hand t-faint" style={{fontSize:11}}>tap to tune · drag to nudge</text>
      <text x={268} y={32} textAnchor="end" className="t-hand t-faint" style={{fontSize:11}}>save</text>
    </g>
    <Capsule x={16} y={496} w={288} h={44}/>
    <text x={30} y={524} className="t-hand t-faint" style={{fontSize:12}}>describe a vibe…</text>
    <Callout show={a} x1={40} y1={434} x2={30} y2={390} text="dial is always present — a small companion" />
    <Callout show={a} x1={268} y1={448} x2={300} y2={410} text="intent input stays primary — dial is the finetune" anchor="end"/>
  </Phone>
);

const B_DialUp = ({a}) => (
  <Phone tag="tuning">
    <Halo/>
    {/* globe dim/behind */}
    <GlobeSketch cx={160} cy={220} r={86}/>
    {/* pulled-up dial — large, pull handle on top */}
    <g>
      <line x1={140} y1={296} x2={180} y2={296} className="ink-line" strokeWidth="1.4"/>
      <rect x={16} y={308} width={288} height={244} rx={24} className="ink-line" strokeWidth="1"/>

function App() {

      if (!e.data) return;
      if (e.data.type === '__activate_edit_mode') setTweakOpen(true);
      if (e.data.type === '__deactivate_edit_mode') setTweakOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({type:'__edit_mode_available'}, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  useEffect(() => { document.documentElement.setAttribute('data-mode', tweaks.mode); }, [tweaks]);

  const set = (k,v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.parent.postMessage({type:'__edit_mode_set_keys', edits:{[k]:v}}, '*');
  };

  const a = tweaks.annotations;

  return (
    <div>

            { name:"playing", idx:"home", Comp:B_Playing, o:"intent morphs into mini-player; dial bar still beneath."},
            { name:"portal", idx:"sheet", Comp:B_Portal, o:"halo opens portal sheet: account, body state, saved moments, status."},
            { name:"memory", idx:"detail", Comp:B_Memory, o:"saved moment as a territory — tracks are nodes, not rows."},
          ].map((v,i)=>(
            <div key={i} className="frame">
              <span className="tape"/>
              <div className="label"><span className="name">{v.name}</span><span className="idx">{v.idx}</span></div>
              <div className="mock"><v.Comp a={a}/></div>
              <p className="oneliner">{v.o}</p>
            </div>
          ))}
        </div>
      </section>

      {/* VARIANT C */}
      <section className="section">
        <div className="section-head">
          <div className="num">C</div>
          <h2>Two surfaces · daily dial, weekly atlas</h2>
          <span className="kicker">density lives HARD here</span>
        </div>
        <div className="diagram">
          <h3>how it works</h3>
          <p>Commits to your collaborator's read: two primary acts at two tempos deserve two surfaces. The <i>daily</i> surface is the dial — with density rendered as shaded arcs of taught space vs open territory. The <i>weekly</i> surface is the atlas — a ritual surface that includes named regions, the week's new pins, and what Woody learned about the user's lexicon. One coordinate system, two views.</p>
          <ArchDiagram kind="twoScreen"/>
        </div>
        <div className="thesis">
          <b>Why it's interesting.</b> Directly honors the "orientation vs tuning" split. The atlas becomes the place where <i>understanding</i> lives (the week's new words learned, new pins, expanded regions), which is closer to Woody's guidance-through-change thesis than a 3D globe you fly around.
          <div style={{marginTop:10}}>
            <span className="pill good">density is central, not smuggled in</span>
            <span className="pill good">atlas = understanding, not just navigation</span>
            <span className="pill good">solves the "primary act" question honestly</span>
            <span className="pill risk">two surfaces = two things to teach</span>
          </div>
        </div>
        <div className="grid5">
          {[
            { name:"idle", idx:"today · daily", Comp:C_Daily, o:"dial is the whole screen. dense arcs = taught. sparse = room."},
            { name:"tuning", idx:"live", Comp:C_Tune, o:"drag trail + floating words. music catches up in 2–4s."},
            { name:"save", idx:"pin this", Comp:C_Save, o:"serif name · pinned at this coordinate forever. full hush."},
            { name:"atlas", idx:"this week", Comp:C_Atlas, o:"weekly ritual · named regions + what Woody learned about your words."},
            { name:"return", idx:"set dial", Comp:C_Return, o:"tap a pin on atlas → dial slides visibly to that coord, plays."},
          ].map((v,i)=>(
            <div key={i} className="frame">
              <span className="tape"/>
              <div className="label"><span className="name">{v.name}</span><span className="idx">{v.idx}</span></div>
              <div className="mock"><v.Comp a={a}/></div>
              <p className="oneliner">{v.o}</p>
            </div>
          ))}
        </div>
      </section>

      <section className="section">
        <div className="section-head">
          <div className="num">D</div>
          <h2>Decision matrix</h2>
          <span className="kicker">how each variant trades off against Woody's job.</span>
        </div>
        <table className="matrix">
          <thead>
            <tr>
              <th>variant</th>
              <th>primary act</th>
              <th>orientation</th>
              <th>tuning</th>
              <th>understanding visible</th>
              <th>risk</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td className="m-name">A · zoom</td><td>one object at two scales</td>
              <td><span className="pill good">strong</span></td>
              <td><span className="pill good">strong</span></td>
              <td><span className="pill meh">density hard on 3D</span></td>
              <td>zoom must be taught</td>
            </tr>
            <tr>
              <td className="m-name">B · bar</td><td>intent + companion</td>
              <td><span className="pill good">keeps current</span></td>
              <td><span className="pill meh">ok</span></td>
              <td><span className="pill meh">hidden</span></td>
              <td>widget energy</td>
            </tr>
            <tr>
              <td className="m-name">C · two</td><td>daily tune, weekly orient</td>
              <td><span className="pill good">strong (atlas)</span></td>
              <td><span className="pill good">strong (dial)</span></td>
              <td><span className="pill good">central to atlas</span></td>
              <td>two surfaces to teach</td>
            </tr>
          </tbody>
        </table>
      </section>

      <section className="section">
        <div className="section-head">
          <div className="num">E</div>
          <h2>My recommendation</h2>
          <span className="kicker">which one to build in hi-fi, and why.</span>
        </div>
        <div className="thesis" style={{maxWidth:960}}>
          <b>Variant C — two surfaces.</b> It's the only one that gives the atlas a real job beyond "decoration." Daily use runs on the dial (the tuning act); weekly, the atlas becomes a ritual where Woody shows you what it learned about your lexicon. That directly answers the "guidance through change" thesis — you're not just navigating, you're reading your own evolving relationship with music. A is elegant but makes density hard; B preserves today's model but the dial ends up feeling like a widget. C commits.
          <div style={{marginTop:10}}>
            <span className="pill good">ship C for hi-fi</span>
            <span className="pill">keep B's portal sheet pattern</span>
            <span className="pill">keep A's "memory = coordinate" idea</span>
          </div>
        </div>
        <div className="grid5" style={{gridTemplateColumns:"1fr 1fr 1fr"}}>
          <div className="frame">
            <span className="tape"/>
            <div className="label"><span className="name">hi-fi flow</span><span className="idx">plan</span></div>
            <p className="oneliner"><b>Open → tune → save → return.</b> Four screens, one coordinate, one user story. Built at full token fidelity (soil, bark, accent-violet, Lora + Inter). Motion noted as annotations.</p>
          </div>
          <div className="frame">
            <span className="tape"/>
            <div className="label"><span className="name">what to watch</span><span className="idx">risks</span></div>
            <p className="oneliner">Keep the daily surface quiet enough that density reads as <i>atmosphere</i>, not dataviz. The atlas is a ritual — it has to reward a weekly open, not demand it.</p>
          </div>
          <div className="frame">
            <span className="tape"/>
            <div className="label"><span className="name">open questions</span><span className="idx">for you</span></div>
            <p className="oneliner">How do we cue the user to open the atlas the first time? Is it a weekly notification? A subtle halo state change? Woody whispering "look at what we learned"?</p>
          </div>
        </div>
      </section>

      <footer className="footer">
        woody · wireframes round 2 · three connection models · recommendation: variant c (two surfaces)
      </footer>

      <div className="tweaks" style={{display: tweakOpen ? 'block' : 'none'}}>
        <h3>Tweaks</h3>
        <div className="row">
          <span>background</span>
          <div style={{display:'flex',gap:6}}>
            {["paper","dark"].map(v=>(
              <button key={v} className={"sw "+(tweaks.mode===v?"active":"")} onClick={()=>set('mode',v)}>{v}</button>
            ))}
          </div>
        </div>
        <div className="row">
          <span>annotations</span>
          <div style={{display:'flex',gap:6}}>
            <button className={"sw "+(tweaks.annotations?"active":"")} onClick={()=>set('annotations',true)}>on</button>
            <button className={"sw "+(!tweaks.annotations?"active":"")} onClick={()=>set('annotations',false)}>off</button>
          </div>
        </div>
        <div className="slim">three connection models · density in C</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

<svg viewBox="0 0 280 64" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!--
    Woody horizontal lockup — icon + wordmark
    Icon on left, Syne-weight wordmark on right
    For app headers, splash screens, social
  -->

  <!-- ── Icon (64×64) ── -->
  <rect width="64" height="64" rx="14" fill="#0a0a0f"/>

  <!-- Grid -->
  <line x1="16" y1="12" x2="16" y2="52" stroke="#18181f" stroke-width="1"/>
  <line x1="32" y1="12" x2="32" y2="52" stroke="#18181f" stroke-width="1"/>
  <line x1="48" y1="12" x2="48" y2="52" stroke="#18181f" stroke-width="1"/>
  <line x1="12" y1="20" x2="52" y2="20" stroke="#18181f" stroke-width="1"/>
  <line x1="12" y1="32" x2="52" y2="32" stroke="#18181f" stroke-width="1"/>
  <line x1="12" y1="44" x2="52" y2="44" stroke="#18181f" stroke-width="1"/>

  <!-- Acoustic arcs -->
  <path d="M 12 44 C 20 44 22 28 32 24 C 42 20 46 18 52 14"
    stroke="#00e5c4" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 12 48 C 24 48 28 36 38 30 C 44 26 50 22 52 20"
    stroke="#4455ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Arc peak glow -->
  <circle cx="52" cy="14" r="3" fill="#00e5c4" opacity="0.9"/>
  <circle cx="52" cy="14" r="6" fill="#00e5c4" opacity="0.12"/>

  <!-- Human figure -->
  <rect x="29" y="22" width="6" height="6" rx="0.5" fill="#f0ede6"/>
  <rect x="29" y="29" width="6" height="7" rx="0.5" fill="#f0ede6"/>
  <rect x="24" y="30" width="4" height="2" rx="0.5" fill="#f0ede6"/>
  <rect x="36" y="30" width="4" height="2" rx="0.5" fill="#f0ede6"/>
  <rect x="29" y="37" width="2.5" height="5" rx="0.5" fill="#f0ede6"/>
  <rect x="32.5" y="37" width="2.5" height="5" rx="0.5" fill="#f0ede6"/>

  <!-- Coordinate dots -->
  <circle cx="16" cy="44" r="1.5" fill="#f0a040" opacity="0.7"/>
  <circle cx="24" cy="36" r="1.5" fill="#f0a040" opacity="0.5"/>
  <circle cx="32" cy="24" r="1.5" fill="#00e5c4" opacity="0.6"/>

  <!-- Icon border -->
  <rect width="64" height="64" rx="14" stroke="#f0ede6" stroke-width="0.5" opacity="0.08"/>

  <!-- ── Wordmark (positioned at x=80) ── -->
  <!--
    Syne 800 geometric letterforms, hand-crafted as paths
    Each letter is a clean geometric construction
    Tracking: -0.03em equivalent at ~36px size
  -->

  <!-- W — double-V form, geometric, heavy -->
  <path d="M80 16 L86 48 L94 28 L102 48 L108 16" stroke="#f0ede6" stroke-width="5.5"
    stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- o — perfect circle, generous weight -->
  <circle cx="126" cy="34" r="12" stroke="#f0ede6" stroke-width="4.5" fill="none"/>

  <!-- d — circle + stem, stem extends above -->
  <circle cx="158" cy="34" r="12" stroke="#f0ede6" stroke-width="4.5" fill="none"/>
  <line x1="170" y1="14" x2="170" y2="46" stroke="#f0ede6" stroke-width="4.5" stroke-linecap="round"/>

  <!-- y — descender letterform -->
  <line x1="185" y1="22" x2="195" y2="40" stroke="#f0ede6" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="205" y1="22" x2="191" y2="54" stroke="#f0ede6" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Teal accent dot — punctuates the wordmark, signals the acoustic identity -->
  <circle cx="214" cy="16" r="4" fill="#00e5c4"/>
</svg>

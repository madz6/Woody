<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!--
    Woody logomark — geometric acoustic field with human figure
    Visual language: algorithmic geometric base + pixelated human accent
    Colors: void background, teal primary, cobalt secondary, moon figure
  -->

  <!-- Background field -->
  <rect width="64" height="64" rx="14" fill="#0a0a0f"/>

  <!-- Geometric grid structure — the "World B" base layer -->
  <!-- Vertical grid lines, subtle -->
  <line x1="16" y1="12" x2="16" y2="52" stroke="#18181f" stroke-width="1"/>
  <line x1="32" y1="12" x2="32" y2="52" stroke="#18181f" stroke-width="1"/>
  <line x1="48" y1="12" x2="48" y2="52" stroke="#18181f" stroke-width="1"/>
  <!-- Horizontal grid lines -->
  <line x1="12" y1="20" x2="52" y2="20" stroke="#18181f" stroke-width="1"/>
  <line x1="12" y1="32" x2="52" y2="32" stroke="#18181f" stroke-width="1"/>
  <line x1="12" y1="44" x2="52" y2="44" stroke="#18181f" stroke-width="1"/>

  <!-- Acoustic arc — the session path through coordinate space -->
  <!-- This is the core Woody concept: the arc from low-energy start to high-energy peak -->
  <path
    d="M 12 44 C 20 44 22 28 32 24 C 42 20 46 18 52 14"
    stroke="#00e5c4"
    stroke-width="2"
    stroke-linecap="round"
    fill="none"
    opacity="0.9"
  />

  <!-- Cobalt secondary arc — second session layer -->
  <path
    d="M 12 48 C 24 48 28 36 38 30 C 44 26 50 22 52 20"
    stroke="#4455ff"
    stroke-width="1.5"
    stroke-linecap="round"
    fill="none"
    opacity="0.5"
  />

  <!-- Teal glow dot at arc peak -->
  <circle cx="52" cy="14" r="3" fill="#00e5c4" opacity="0.9"/>
  <circle cx="52" cy="14" r="6" fill="#00e5c4" opacity="0.12"/>

  <!-- Pixelated human figure — the "World A" accent, standing in the field -->
  <!-- Body: 2px pixel grid, positioned at mid-arc -->
  <!-- Head -->
  <rect x="29" y="22" width="6" height="6" rx="0.5" fill="#f0ede6"/>
  <!-- Torso -->
  <rect x="29" y="29" width="6" height="7" rx="0.5" fill="#f0ede6"/>
  <!-- Arms (outstretched — dancing pose) -->
  <rect x="24" y="30" width="4" height="2" rx="0.5" fill="#f0ede6"/>
  <rect x="36" y="30" width="4" height="2" rx="0.5" fill="#f0ede6"/>
  <!-- Legs -->
  <rect x="29" y="37" width="2.5" height="5" rx="0.5" fill="#f0ede6"/>
  <rect x="32.5" y="37" width="2.5" height="5" rx="0.5" fill="#f0ede6"/>

  <!-- Small coordinate dots on grid — waypoints, acoustic moments -->
  <circle cx="16" cy="44" r="1.5" fill="#f0a040" opacity="0.7"/>
  <circle cx="24" cy="36" r="1.5" fill="#f0a040" opacity="0.5"/>
  <circle cx="32" cy="24" r="1.5" fill="#00e5c4" opacity="0.6"/>

  <!-- Subtle outer border -->
  <rect width="64" height="64" rx="14" stroke="#f0ede6" stroke-width="0.5" opacity="0.08"/>
</svg>

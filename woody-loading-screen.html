<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Woody — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-soil:      #0F0F0D;
    --bg-moss:      #171713;
    --bg-bark:      #1E1B18;
    --accent-violet:#7C6BCE;
    --accent-amber: #C4874A;
    --accent-moss:  #4E6B45;
    --text-hi:      #E8E4DC;
    --text-mid:     #8A8680;
    --text-lo:      #4A4844;
    /* HK cinema green wash */
    --hk-green:     rgba(40, 80, 45, 0.06);
  }

  body {
    background: var(--bg-soil);
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    cursor: none;
  }

  /* Film grain layer */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.4'/%3E%3C/svg%3E");
    opacity: 0.045;
    pointer-events: none;
    z-index: 100;
    animation: grain 0.18s steps(1) infinite;
  }

  @keyframes grain {
    0%   { transform: translate(0,0); }
    10%  { transform: translate(-2%,-3%); }
    20%  { transform: translate(3%,1%); }
    30%  { transform: translate(-1%,4%); }
    40%  { transform: translate(4%,-1%); }
    50%  { transform: translate(-3%,2%); }
    60%  { transform: translate(2%,-4%); }
    70%  { transform: translate(-4%,3%); }
    80%  { transform: translate(1%,-2%); }
    90%  { transform: translate(-2%,4%); }
    100% { transform: translate(3%,-3%); }
  }

  /* HK cinema color grade */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 120% 80% at 40% 60%, var(--hk-green), transparent 70%);
    pointer-events: none;
    z-index: 99;
    mix-blend-mode: color-dodge;
  }

  canvas {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  /* Custom cursor */
  .cursor {
    position: fixed;
    width: 6px;
    height: 6px;
    background: var(--accent-violet);
    border-radius: 50%;
    pointer-events: none;
    z-index: 200;
    transform: translate(-50%, -50%);
    transition: transform 0.1s ease, opacity 0.3s;
    box-shadow: 0 0 12px var(--accent-violet);
  }

  /* UI layer */
  .ui {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .wordmark {
    font-family: 'Lora', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 15px;
    letter-spacing: 0.18em;
    color: var(--text-mid);
    text-transform: lowercase;
    opacity: 0;
    animation: fadeIn 2.4s ease 1.2s forwards;
    position: absolute;
    top: 48px;
    left: 52px;
  }

  .center-text {
    text-align: center;
    opacity: 0;
    animation: riseIn 2s ease 2.8s forwards;
  }

  .entering-line {
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--text-lo);
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }

  .intent-prompt {
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 22px;
    color: var(--text-hi);
    letter-spacing: 0.02em;
    line-height: 1.4;
    max-width: 380px;
    opacity: 0.85;
  }

  .bottom-ui {
    position: absolute;
    bottom: 44px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    opacity: 0;
    animation: fadeIn 1.8s ease 3.8s forwards;
  }

  .progress-track {
    width: 180px;
    height: 1px;
    background: var(--text-lo);
    opacity: 0.3;
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, var(--accent-violet), var(--accent-amber));
    width: 0%;
    animation: loadProgress 3.5s cubic-bezier(0.4, 0, 0.2, 1) 1s forwards;
  }

  .progress-label {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--text-lo);
    text-transform: uppercase;
    margin-left: 16px;
  }

  /* Dino-moment: tiny interactive element */
  .dino-hint {
    position: absolute;
    bottom: 78px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text-lo);
    opacity: 0;
    animation: fadeIn 1.5s ease 5s forwards;
    text-transform: uppercase;
  }

  .dino-hint span {
    color: var(--text-mid);
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes loadProgress {
    0%   { width: 0%; }
    30%  { width: 28%; }
    55%  { width: 52%; }
    75%  { width: 74%; }
    90%  { width: 89%; }
    100% { width: 100%; }
  }

  /* Scan line (HK cinema) */
  .scanline {
    position: fixed;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(40,80,30,0.12), transparent);
    z-index: 98;
    animation: scan 8s linear infinite;
    pointer-events: none;
  }

  @keyframes scan {
    0%   { top: -2px; opacity: 0; }
    5%   { opacity: 1; }
    95%  { opacity: 1; }
    100% { top: 100vh; opacity: 0; }
  }

  /* Vignette */
  .vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 85% 85% at 50% 50%, transparent 40%, rgba(10,9,8,0.7) 100%);
    pointer-events: none;
    z-index: 48;
  }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="scanline"></div>
<div class="vignette"></div>

<canvas id="c"></canvas>

<div class="ui">
  <div class="wordmark">woody</div>

  <div class="center-text">
    <div class="entering-line">entering your territory</div>
    <div class="intent-prompt" id="intentPrompt">late night drive,<br>something unresolved</div>
  </div>

  <div class="dino-hint">move to navigate — <span>space to pause</span></div>

  <div class="bottom-ui">
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
    <div class="progress-label">mapping</div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const cursor = document.getElementById('cursor');

let W, H, mouse = { x: 0, y: 0 }, time = 0;
let particles = [], flowField = [], cols, rows;
const CELL = 18;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cols = Math.ceil(W / CELL) + 1;
  rows = Math.ceil(H / CELL) + 1;
  initField();
}

// Flow field — Son of the White Mare energy
function initField() {
  flowField = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      flowField.push(0);
    }
  }
}

function updateField() {
  const t = time * 0.0006;
  const mx = (mouse.x / W - 0.5) * 2.2;
  const my = (mouse.y / H - 0.5) * 2.2;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = c / cols;
      const y = r / rows;
      // layered noise-like field
      const angle =
        Math.sin(x * 3.8 + t + mx * 0.8) * Math.PI +
        Math.cos(y * 2.9 - t * 1.3 + my * 0.6) * Math.PI +
        Math.sin((x + y) * 2.1 + t * 0.7) * Math.PI * 0.5;
      flowField[r * cols + c] = angle;
    }
  }
}

// Particle system
class Particle {
  constructor() { this.reset(); }

  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.life = Math.random() * 220 + 60;
    this.maxLife = this.life;
    this.speed = Math.random() * 0.9 + 0.3;

    // Color based on Woody palette + HK green tint
    const roll = Math.random();
    if (roll < 0.38)      this.color = [124, 108, 206]; // violet
    else if (roll < 0.58) this.color = [78,  107,  69]; // moss
    else if (roll < 0.72) this.color = [196, 135,  74]; // amber
    else if (roll < 0.82) this.color = [55,  100,  60]; // hk green
    else                  this.color = [140,  92,  92]; // rose
    this.size = Math.random() * 1.1 + 0.2;
  }

  update() {
    const col = Math.floor(this.x / CELL);
    const row = Math.floor(this.y / CELL);
    if (col >= 0 && col < cols && row >= 0 && row < rows) {
      const angle = flowField[row * cols + col];
      this.x += Math.cos(angle) * this.speed;
      this.y += Math.sin(angle) * this.speed;
    }
    this.life--;
    if (this.life <= 0 || this.x < -10 || this.x > W + 10 || this.y < -10 || this.y > H + 10) {
      this.reset();
    }
  }

  draw() {
    const alpha = (this.life / this.maxLife) * 0.55;
    const [r, g, b] = this.color;
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function initParticles(n = 1800) {
  particles = Array.from({ length: n }, () => new Particle());
}

// Globe glyph — Woody's core map metaphor materializing
let globeAlpha = 0;
let globeScale = 0;

function drawGlobe() {
  const cx = W / 2, cy = H / 2;
  const r  = Math.min(W, H) * 0.22;

  globeAlpha = Math.min(1, time * 0.0008);
  globeScale = 0.6 + 0.4 * Math.min(1, time * 0.0006);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(globeScale, globeScale);

  // Outer glow
  const grd = ctx.createRadialGradient(0, 0, r * 0.4, 0, 0, r * 1.6);
  grd.addColorStop(0,   `rgba(124,108,206,${0.06 * globeAlpha})`);
  grd.addColorStop(0.5, `rgba(78,107,69,${0.04 * globeAlpha})`);
  grd.addColorStop(1,   'transparent');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(0, 0, r * 1.6, 0, Math.PI * 2);
  ctx.fill();

  // Contour rings (territory visualization)
  const numRings = 6;
  for (let i = 1; i <= numRings; i++) {
    const rr = (r / numRings) * i;
    const wobble = Math.sin(time * 0.001 + i * 0.8) * 2;
    ctx.strokeStyle = `rgba(138,134,128,${(0.06 - i * 0.007) * globeAlpha})`;
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.arc(0, wobble * 0.4, rr, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Meridian lines
  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI + time * 0.00015;
    ctx.strokeStyle = `rgba(124,108,206,${0.07 * globeAlpha})`;
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.ellipse(0, 0, r * Math.abs(Math.cos(angle)), r, angle, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Core sphere
  const sphereGrd = ctx.createRadialGradient(-r*0.2, -r*0.2, 0, 0, 0, r);
  sphereGrd.addColorStop(0,   `rgba(42,37,32,${0.9 * globeAlpha})`);
  sphereGrd.addColorStop(0.7, `rgba(23,23,19,${0.95 * globeAlpha})`);
  sphereGrd.addColorStop(1,   `rgba(15,15,13,${globeAlpha})`);
  ctx.fillStyle = sphereGrd;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // Territory nodes
  const nodes = [
    { x: -r*0.3, y: -r*0.2, c: [124,108,206], s: 2.5, label: 'jazz / smoky' },
    { x:  r*0.25, y: -r*0.35, c: [78,107,69],  s: 2,   label: 'earthy / folk' },
    { x: -r*0.1, y:  r*0.3,  c: [196,135,74],  s: 3,   label: 'electronic' },
    { x:  r*0.4, y:  r*0.1,  c: [140,92,92],   s: 1.8, label: 'ambient' },
    { x: -r*0.45,y:  r*0.05, c: [100,120,80],  s: 2.2, label: 'sacred' },
  ];

  nodes.forEach(n => {
    const pulse = 1 + Math.sin(time * 0.002 + n.x) * 0.3;
    const [nr,ng,nb] = n.c;
    // glow
    const ng2 = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.s * 5 * pulse);
    ng2.addColorStop(0, `rgba(${nr},${ng},${nb},${0.4 * globeAlpha})`);
    ng2.addColorStop(1, 'transparent');
    ctx.fillStyle = ng2;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.s * 5 * pulse, 0, Math.PI * 2);
    ctx.fill();
    // dot
    ctx.fillStyle = `rgba(${nr},${ng},${nb},${0.9 * globeAlpha})`;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.s, 0, Math.PI * 2);
    ctx.fill();
  });

  // Connection threads (territory paths)
  for (let i = 0; i < nodes.length - 1; i++) {
    const a = nodes[i], b = nodes[(i+1)%nodes.length];
    ctx.strokeStyle = `rgba(138,134,128,${0.07 * globeAlpha})`;
    ctx.lineWidth = 0.4;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    const mx = (a.x + b.x) / 2 + Math.sin(time * 0.0008 + i) * 20;
    const my = (a.y + b.y) / 2 + Math.cos(time * 0.0008 + i) * 20;
    ctx.quadraticCurveTo(mx, my, b.x, b.y);
    ctx.stroke();
  }

  ctx.restore();
}

// Mouse parallax — the globe tilts gently
function getMouseInfluence() {
  return {
    x: (mouse.x / W - 0.5),
    y: (mouse.y / H - 0.5)
  };
}

let rafId;
function loop() {
  time++;

  // Fade trail — darker trail = more mythological density
  ctx.fillStyle = 'rgba(15,15,13,0.18)';
  ctx.fillRect(0, 0, W, H);

  updateField();

  // Draw particles
  particles.forEach(p => { p.update(); p.draw(); });

  // Draw globe
  drawGlobe();

  rafId = requestAnimationFrame(loop);
}

// Cycling intent prompts (the app breathing)
const prompts = [
  'late night drive,\nsomething unresolved',
  'afternoon rain,\nno words yet',
  'three days after\na thing happened',
  'almost dancing,\nnot quite',
  'the feeling before\nyou say it',
];
let promptIdx = 0;
const intentEl = document.getElementById('intentPrompt');

function cyclePrompt() {
  intentEl.style.opacity = '0';
  intentEl.style.transition = 'opacity 0.8s ease';
  setTimeout(() => {
    promptIdx = (promptIdx + 1) % prompts.length;
    intentEl.innerHTML = prompts[promptIdx].replace('\n','<br>');
    intentEl.style.opacity = '0.85';
  }, 900);
}

// Keyboard: spacebar pauses like Chrome dino energy
let paused = false;
document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    paused = !paused;
    if (paused) { cancelAnimationFrame(rafId); }
    else { loop(); }
  }
});

// Mouse
document.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  cursor.style.left = e.clientX + 'px';
  cursor.style.top  = e.clientY + 'px';
});

// Init
window.addEventListener('resize', resize);
resize();
initParticles();
loop();
setInterval(cyclePrompt, 4500);
</script>
</body>
</html>
